<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manon Lescaut — Bilan interactif</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#2b2d42;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header,section{border-radius:20px;padding:20px;background:#ece8fb;margin-bottom:20px}h1,h2{color:#65529e}h1{margin:0}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{background:white;border:1px solid #ded5ee;border-radius:14px;padding:16px;margin:12px 0}h3{font-size:1rem;margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid #c9bde2;border-radius:9px;padding:10px;background:white;color:#352b50}article button{display:block;width:100%;text-align:left;margin:6px 0}button:hover:not(:disabled){background:#ece8fb}button:disabled{cursor:default}button.good{background:#e0f1ea;border-color:#40805d}button.bad{background:#ffede8;border-color:#a34b38}.feedback{margin:10px 0 0;padding:10px;background:#f4f0fa;border-radius:8px}#status{font-weight:700;color:#65529e}#reset{background:#65529e;color:white}a{color:#65529e}@media(max-width:700px){#grid{grid-template-columns:1fr}main{padding:12px}}

</style><main><header><p>Mission Bac Français · Roman</p><h1>Manon Lescaut — Bilan interactif</h1><p>Choisis une réponse par question. La correction apparaît immédiatement. Chaque bonne réponse vaut un point.</p><p id="status" role="status">0 / 20 réponses · Score : 0 / 20</p><button id="reset">Recommencer</button></header><div id="grid"><section><h2>Comprendre le roman</h2><div id="a"></div></section><section><h2>Comprendre les enjeux de l’œuvre</h2><div id="b"></div></section></div><p><a href="https://missionbacfrancais.fr/?page_id=1721">Retour au cours</a></p></main><script>const qs=[["Qui raconte les premières pages du roman ?",["Des Grieux","Renoncour","Tiberge","Lescaut"],1,"Renoncour, l’homme de qualité, ouvre le récit cadre."],["Où les deux amants se rencontrent-ils ?",["Paris","Pacy","Amiens","Chaillot"],2,"La rencontre a lieu à Amiens."],["Quel destin les parents de Manon lui réservent-ils ?",["Le couvent","Le mariage avec Tiberge","Le théâtre","Un voyage en Amérique"],0,"Manon est envoyée au couvent malgré elle."],["Qui incarne la fidélité amicale ?",["M. B.","Synnelet","Lescaut","Tiberge"],3,"Tiberge reste fidèle à son ami malgré ses fautes."],["Où Manon retrouve-t-elle Des Grieux après leur première séparation ?",["À Saint-Lazare","À Saint-Sulpice","À Pacy","À la Nouvelle-Orléans"],1,"Des Grieux a repris ses études à Saint-Sulpice."],["Comment Des Grieux gagne-t-il de l’argent au jeu ?",["Il hérite","Il vend ses livres","Il triche","Il devient gouverneur"],2,"Il rejoint une ligue de tricheurs."],["Où Des Grieux est-il enfermé après la ruse contre le vieux G… M… ?",["À Saint-Lazare","Au couvent","À l’Hôpital","À Amiens"],0,"Des Grieux est enfermé à Saint-Lazare, Manon à l’Hôpital."],["Qui aide Des Grieux à libérer Manon ?",["Synnelet et M. B.","Son père et Renoncour","Le prince italien et Tiberge","M. de T. et Marcel"],3,"M. de T. et Marcel participent à la libération de Manon."],["Qui devient le rival de Des Grieux en Amérique ?",["Lescaut","Synnelet","M. B.","Renoncour"],1,"Synnelet souhaite épouser Manon."],["Qui ramène Des Grieux en France ?",["Le gouverneur","Marcel","Tiberge","M. de T."],2,"Tiberge vient chercher son ami après la mort de Manon."],["Pourquoi parle-t-on de structure cyclique ?",["Des situations similaires se répètent","Le récit se déroule en un jour","Chaque chapitre a un narrateur différent","Le récit ne comporte aucun retour en arrière"],0,"Amour, difficultés financières, rivalités et enfermements se répètent."],["Qu’est-ce qui distingue le dernier cycle ?",["Manon entre au couvent","Des Grieux devient riche","Les amants se séparent définitivement à Paris","La mort de Manon rompt la répétition"],3,"Le dénouement tragique empêche une nouvelle réunion des amants."],["Comment évolue la marginalité de Des Grieux ?",["Elle disparaît après Amiens","Elle s’accentue progressivement","Elle est uniquement liée à sa pauvreté","Elle ne concerne que sa religion"],1,"Il transgresse progressivement les normes familiales, sociales et légales."],["Que révèle le traitement différent des deux amants ?",["Leur différence d’âge","Leur nationalité","Le poids du rang social","Leur absence de sentiments"],2,"Des Grieux bénéficie de sa naissance et de l’intervention de son père."],["Quelle fidélité Manon revendique-t-elle ?",["Celle du cœur","Celle de la fortune","Celle du rang","Celle de la famille"],0,"Manon distingue la fidélité du cœur de ses comportements."],["Que représente Tiberge face à la passion ?",["La recherche du luxe","La vengeance","La rivalité amoureuse","La vertu et la raison"],3,"Il incarne une autre voie que celle de la passion."],["Qu’est-ce qui nourrit les plaisirs du romanesque ?",["L’absence de péripéties","Les coups de théâtre et les évasions","Les seules descriptions de paysages","Un récit sans conflits"],1,"Les rebondissements entretiennent le suspense."],["Quel effet produisent les regrets du narrateur dès la rencontre ?",["Ils annoncent une fin heureuse","Ils effacent le passé","Ils annoncent le malheur","Ils interrompent définitivement le récit"],2,"Les regrets rétrospectifs annoncent le dénouement tragique."],["Que désigne le libertinage dans le cours ?",["Une libre pensée qui s’écarte des normes","Une obéissance absolue aux règles","Un genre exclusivement poétique","Une forme de récit cadre"],0,"Le libertinage s’écarte des normes sociales, culturelles ou religieuses."],["Quelle tension morale traverse le roman ?",["Le récit refuse toute émotion","Les amants sont toujours exemplaires","Le récit ne présente aucun danger","Le récit montre les dangers de la passion tout en suscitant la compassion"],3,"Le lecteur est invité à réfléchir aux conséquences de la passion tout en éprouvant de la compassion."]];let score=0,done=0;function render(){score=done=0;document.getElementById('status').textContent='0 / 20 réponses · Score : 0 / 20';for(const id of ['a','b'])document.getElementById(id).replaceChildren();qs.forEach(([question,opts,correct,why],i)=>{const card=document.createElement('article'),h=document.createElement('h3');h.textContent=(i+1)+'. '+question;card.append(h);const buttons=opts.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{done++;if(j===correct)score++;buttons.forEach((x,k)=>{x.disabled=true;if(k===correct)x.classList.add('good');else if(k===j)x.classList.add('bad')});const f=document.createElement('p');f.className='feedback';f.setAttribute('role','status');f.textContent=(j===correct?'Bonne réponse ! ':'Réponse incorrecte. Bonne réponse : '+opts[correct]+'. ')+why;card.append(f);document.getElementById('status').textContent=done===20?'Bilan terminé — Score final : '+score+' / 20':done+' / 20 réponses · Score : '+score+' / 20'};card.append(b);return b});document.getElementById(i<10?'a':'b').append(card)})}document.getElementById('reset').onclick=render;render();</script></html>
