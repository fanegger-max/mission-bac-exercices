<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gargantua — Bilan interactif</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#2b2d42;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header,section{border-radius:20px;padding:20px;background:#ece8fb;margin-bottom:20px}h1,h2{color:#65529e}h1{margin:0}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{background:white;border:1px solid #ded5ee;border-radius:14px;padding:16px;margin:12px 0}h3{font-size:1rem;margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid #c9bde2;border-radius:9px;padding:10px;background:white;color:#352b50}article button{display:block;width:100%;text-align:left;margin:6px 0}button:hover:not(:disabled){background:#ece8fb}button:disabled{cursor:default}button.good{background:#e0f1ea;border-color:#40805d}button.bad{background:#ffede8;border-color:#a34b38}.feedback{margin:10px 0 0;padding:10px;background:#f4f0fa;border-radius:8px}#status{font-weight:700;color:#65529e}#reset{background:#65529e;color:white}a{color:#65529e}@media(max-width:700px){#grid{grid-template-columns:1fr}main{padding:12px}}

</style><main><header><p>Mission Bac Français · Roman</p><h1>Gargantua — Bilan interactif</h1><p>Choisis une réponse par question. La correction apparaît immédiatement. Chaque bonne réponse vaut un point.</p><p id="status" role="status">0 / 20 réponses · Score : 0 / 20</p><button id="reset">Recommencer</button></header><div id="grid"><section><h2>Comprendre le roman</h2><div id="a"></div></section><section><h2>Humanisme, rire et savoir</h2><div id="b"></div></section></div><p><a href="https://missionbacfrancais.fr/gargantua/">Retour au cours</a></p></main><script>const qs=[["En quelle année paraît Gargantua ?",["1532","1534","1546","1552"],1,"Le cours retient 1534 pour Gargantua."],["Quel pseudonyme est une anagramme de François Rabelais ?",["Alcofribas Nasier","Janotus de Bragmardo","Thubal Holoferne","Ulrich Gallet"],0,"Alcofribas Nasier est le pseudonyme du narrateur."],["Dans quel ordre se déroulent les grandes étapes du roman ?",["Éducation, naissance, guerre, récompenses","Naissance, guerre, éducation, récompenses","Naissance, éducation, guerre, récompenses","Naissance, éducation, récompenses, guerre"],2,"Le roman suit les étapes de la formation du géant."],["Par où Gargantua vient-il au monde ?",["La bouche","Le nez","Le nombril","L’oreille de sa mère"],3,"Cette naissance extraordinaire évoque les récits mythologiques."],["Qui incarne l’éducation sophiste ?",["Ponocrates","Thubal Holoferne","Gymnaste","Anagnostes"],1,"Thubal Holoferne représente un enseignement mécanique et stérile."],["Quel épisode révèle l’intelligence du jeune géant ?",["Le torche-cul","La fondation de Thélème","La bataille de Seuilly","Le discours de Janotus"],0,"Grandgousier découvre l’intelligence de son fils dans cet épisode comique."],["Quel incident déclenche la guerre picrocholine ?",["Le vol des cloches","Une querelle de précepteurs","Un différend autour des fouaces","La construction de Thélème"],2,"Le conflit naît d’un différend dérisoire autour des fouaces."],["Quel personnage défend l’abbaye de Seuilly ?",["Eudémon","Ulrich Gallet","Janotus","Frère Jean"],3,"Frère Jean défend Seuilly puis rejoint les troupes de Grandgousier."],["Quelle attitude Grandgousier privilégie-t-il face au conflit ?",["La conquête","Le dialogue","La vengeance","La fuite"],1,"Il cherche à éviter la guerre par le dialogue."],["Quelle récompense Frère Jean souhaite-t-il ?",["Une abbaye","Un titre royal","Une fortune","Une armée"],0,"Il préfère fonder l’abbaye de Thélème."],["Quelle découverte remet en cause la place centrale de la Terre ?",["L’imprimerie","La redécouverte du grec","L’héliocentrisme","La découverte de l’Amérique"],2,"Copernic propose une représentation héliocentrique."],["Quel principe caractérise la lecture humaniste des textes antiques ?",["Apprendre uniquement les commentaires","Refuser les langues anciennes","Répéter les autorités sans les discuter","Accéder directement aux textes"],3,"Les humanistes valorisent l’accès aux sources et la réflexion personnelle."],["Que privilégie Ponocrates ?",["La mémorisation sans compréhension","L’harmonie du corps et de l’esprit","La seule pratique sportive","La seule étude des commentaires"],1,"Son enseignement associe savoirs, hygiène, exercice physique et réflexion."],["Quelles sont les deux sources de la sagesse selon Érasme ?",["Les textes antiques et la Bible","Les traités militaires et le droit","Les commentaires scolastiques et les proverbes","Les romans de chevalerie et les chroniques"],0,"Érasme valorise les textes antiques et bibliques."],["Quel souverain Picrochole peut-il caricaturer ?",["François Ier","Henri VIII","Charles Quint","Louis XVIII"],2,"Le cours rapproche ses ambitions de celles de Charles Quint."],["Que signifie l’image des silènes dans le prologue ?",["Le savoir doit rester secret","Le rire exclut la réflexion","La beauté garantit la sagesse","Une apparence ridicule peut cacher un contenu précieux"],3,"Les silènes illustrent le contraste entre apparence et profondeur."],["Que signifie « sucer la substantifique moelle » ?",["Retenir le titre du livre","Dépasser le sens littéral par une lecture attentive","Se limiter aux plaisanteries","Apprendre le texte sans l’interpréter"],1,"La métaphore canine invite à une lecture active et critique."],["Quel procédé domine dans la durée excessive de l’apprentissage de l’alphabet ?",["L’hyperbole","L’euphémisme","La litote","La personnification"],0,"L’exagération temporelle ridiculise l’enseignement sophiste."],["Pourquoi Thélème peut-elle fonctionner sans règles imposées ?",["Ses habitants sont surveillés","Ses habitants renoncent au savoir","Ses habitants sont disposés à la vertu","Ses habitants vivent isolément les uns des autres"],2,"La liberté repose sur l’honneur et la disposition à la vertu."],["Quelle idée résume le parcours « Rire et savoir » ?",["Le rire empêche toute réflexion","Le savoir exige de renoncer au plaisir","Le comique ne sert qu’à divertir","Le rire peut instruire et développer l’esprit critique"],3,"Rabelais associe plaisir, critique des faux savoirs et réflexion."]];let score=0,done=0;function render(){score=done=0;document.getElementById('status').textContent='0 / 20 réponses · Score : 0 / 20';for(const id of ['a','b'])document.getElementById(id).replaceChildren();qs.forEach(([question,opts,correct,why],i)=>{const card=document.createElement('article'),h=document.createElement('h3');h.textContent=(i+1)+'. '+question;card.append(h);const buttons=opts.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{done++;if(j===correct)score++;buttons.forEach((x,k)=>{x.disabled=true;if(k===correct)x.classList.add('good');else if(k===j)x.classList.add('bad')});const f=document.createElement('p');f.className='feedback';f.setAttribute('role','status');f.textContent=(j===correct?'Bonne réponse ! ':'Réponse incorrecte. Bonne réponse : '+opts[correct]+'. ')+why;card.append(f);document.getElementById('status').textContent=done===20?'Bilan terminé — Score final : '+score+' / 20':done+' / 20 réponses · Score : '+score+' / 20'};card.append(b);return b});document.getElementById(i<10?'a':'b').append(card)})}document.getElementById('reset').onclick=render;render();</script></html>
