<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bilan de versification</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#ece8fb;color:#2b2d42;max-width:1100px;margin:auto;padding:20px}h1{color:#285c98}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}article{background:white;border-radius:16px;padding:18px}button{font:inherit;border:1px solid #285c98;border-radius:8px;background:white;color:#285c98;padding:8px 12px;margin:4px;cursor:pointer}button:disabled{opacity:1}button.good{background:#d9f3df;color:#165c30}button.bad{background:#fbe0df;color:#9c2626}#score{font-weight:bold}a{color:#285c98}
/* Harmonisation graphique Mission Bac Français */
body{font-size:16px;line-height:1.7}
body{box-sizing:border-box;width:100%;max-width:1100px;margin:0 auto;padding:24px}
article{border-radius:24px;padding:24px}
h1{color:#285c98;font-size:clamp(1.35rem,2.15vw,1.8rem);line-height:1.3;margin:0 0 12px}
@media(max-width:650px){body{padding:12px}article{padding:14px}main{grid-template-columns:minmax(0,1fr)}}
</style><h1>Me tester — La versification</h1><p>Choisis la bonne réponse. Lis la correction avant de poursuivre.</p><p id="score" role="status"></p><main id="quiz"></main><p><button id="reset">Recommencer</button> <a href="https://missionbacfrancais.fr/la-versification/">Revenir au cours</a></p><script>const qs=[["Comment appelle-t-on un vers de 12 syllabes ?","Alexandrin","Décasyllabe","Octosyllabe","Un alexandrin compte douze syllabes."],["Un vers de 8 syllabes est un…","Octosyllabe","Hexasyllabe","Heptasyllabe","Octo- signifie huit."],["« Demain, dès l’aube, à l’heure où blanchit la campagne » (Hugo) : combien de syllabes ?","12","10","13","De/main/dès/l’aub(e)/à/l’heur(e)/où/blan/chit/la/cam/pagn(e) : 12 syllabes."],["Une strophe de quatre vers est un…","Quatrain","Tercet","Quintil","Le quatrain comporte quatre vers."],["Une strophe de six vers est un…","Sizain","Sixain de syllabes","Distique","Le sizain comporte six vers."],["Dans « C’est un trou de verdure où chante une rivière », le e final de verdure compte-t-il ?","Non, devant une voyelle","Oui, toujours","Non, car il termine le vers","Le e de verdure s’élide devant où."],["Dans « une rivière », le e de une compte-t-il ?","Oui, devant une consonne","Non, jamais","Non, devant une voyelle","Le r de rivière est une consonne."],["Le e muet en fin de vers compte-t-il ?","Non","Oui","Seulement dans un sonnet","Il ne compte pas dans le mètre."],["Quel est le schéma de rivière / haillons / fière / rayons ?","ABAB","ABBA","AABB","Rivière rime avec fière, haillons avec rayons : rimes croisées."],["ABBA correspond à des rimes…","Embrassées","Plates","Croisées","Les rimes A encadrent les rimes B."],["AABB correspond à des rimes…","Plates ou suivies","Croisées","Embrassées","Deux paires se succèdent."],["Sombre / ombre : quel genre de rimes ?","Féminines","Masculines","Alternées","Ces mots se terminent par un e muet."],["Fou / cou : quelle richesse ?","Pauvre","Suffisante","Riche","Un seul son commun : [u]."],["Farouche / bouche : quelle richesse ?","Suffisante","Pauvre","Riche","Deux sons communs : [uʃ]."],["Coquillage / feuillage : quelle richesse ?","Riche","Pauvre","Suffisante","Au moins trois sons communs : [jaʒ]."],["Où se trouve la césure classique de « Le buffet est ouvert et verse dans son ombre » (Rimbaud) ?","Après ouvert","Après buffet","Après verse","Elle sépare deux hémistiches de six syllabes."],["« Du jambon rose et blanc parfumé d’une gousse / D’ail, — et m’emplit la chope immense, avec sa mousse » (Rimbaud) : quel procédé met D’ail en valeur ?","Rejet","Contre-rejet","Césure","Le groupe bref D’ail est reporté au début du vers suivant."],["Un groupe bref en fin de vers annonce une construction développée au vers suivant : quel procédé ?","Contre-rejet","Rejet","Diérèse","Le groupe bref précède le développement syntaxique."],["Une phrase se poursuit largement dans le vers suivant : quel procédé ?","Enjambement","Assonance","Césure","La syntaxe dépasse la limite du vers."],["Prononcer li-on en deux syllabes correspond à…","Une diérèse","Une synérèse","Une césure","La diérèse sépare deux sons habituellement groupés."],["« Pour qui sont ces serpents qui sifflent sur vos têtes ? » (Racine) : répétition du son [s] ?","Allitération","Assonance","Diérèse","Le son [s] est consonantique."],["« Tout m’afflige et me nuit et conspire à me nuire » (Racine) : répétition du son [i] ?","Assonance","Allitération","Rejet","Le son [i] est vocalique."],["Quelle est la structure traditionnelle du sonnet ?","Deux quatrains et deux tercets","Quatre quatrains","Deux sizains","Quatorze vers : 4 + 4 + 3 + 3."],["Comment nomme-t-on le retournement de sens dans un sonnet ?","Volta","Césure","Hémistiche","La volta marque un changement de thème ou de point de vue."]];let score=0,done=0;const root=document.getElementById('quiz');function status(){document.getElementById('score').textContent='Score : '+score+'/'+qs.length+' — '+done+'/'+qs.length+' réponses';}function start(){score=done=0;root.replaceChildren();qs.forEach((q,i)=>{const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),f=document.createElement('p');h.textContent='Question '+(i+1);p.textContent=q[0];a.append(h,p);const opts=q.slice(1,4);for(let j=opts.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[opts[j],opts[k]]=[opts[k],opts[j]];}let bs=[];f.setAttribute('role','status');opts.forEach(o=>{let b=document.createElement('button');b.textContent=o;bs.push(b);a.append(b);b.onclick=()=>{done++;if(o===q[1])score++;bs.forEach(x=>{x.disabled=true;if(x.textContent===q[1])x.classList.add('good');});if(o!==q[1])b.classList.add('bad');f.textContent=(o===q[1]?'Bravo ! ':'Réponse : '+q[1]+'. ')+q[4];status();};});a.append(f);root.append(a);});status();}document.getElementById('reset').onclick=start;start();</script></html>
