<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justifier l’emploi du mode</title><style>*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:12px;font:16px/1.6 system-ui;color:#2b2d42}main{background:#e0f1ea;border-radius:20px;padding:20px}h2,h3{color:#285c98}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:white;border-radius:14px;padding:16px;min-width:0}mark{background:#c5dcf8;color:#183c68;border-radius:4px;padding:2px}button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:#285c98;color:white;cursor:pointer;margin:8px 0}label{display:inline-block;margin:8px 16px 8px 0}small{color:#555}.correction{background:#fff2f8;padding:12px;border-radius:10px} [hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}select{width:100%;font:inherit;padding:8px;border:1px solid #c5d5e7;border-radius:8px;background:white;color:#2b2d42}</style></head><body><main><h2>Exercice 6 — Justifier l’emploi du mode</h2><p>Le mode est indiqué. Choisis la justification qui explique son emploi dans la circonstancielle surlignée.</p><div class="grid" id="grid"></div><button id="score">Calculer mon score final</button> <button id="reset">Recommencer</button><p id="result" aria-live="polite"></p></main><script>const data=[["La Marquise interrogea le philosophe ","lorsque les étoiles apparurent",".","Indicatif",0,"La circonstancielle de temps décrit la situation dans laquelle s’est produit le fait principal.","Phrase construite"],["Le philosophe poursuit ses explications ","afin que la Marquise comprenne le mouvement des planètes",".","Subjonctif",2,"La circonstancielle de but ouvre une perspective : elle exprime l’intention du philosophe.","Phrase construite"],["Nous observerons la lune ","avant que les nuages la cachent",".","Subjonctif",1,"La circonstancielle de temps ouvre une perspective d’anticipation chronologique.","Phrase construite"],["Il n’est point à son aise ","quand il n’y est pas",".","Indicatif",0,"La circonstancielle de temps décrit la situation dans laquelle se produit le fait principal.","Fontenelle, Premier Soir"],["","Bien que les étoiles paraissent immobiles",", elles se déplacent.","Subjonctif",4,"La circonstancielle de concession présente une situation contraire à ce qui est normalement attendu : leur apparente immobilité n’empêche pas leur mouvement.","Phrase construite"],["Nous reprendrons notre conversation ","quand le soleil se couchera",".","Indicatif",0,"La circonstancielle de temps décrit la situation future dans laquelle se produira le fait principal.","Phrase construite"],["","Pourvu que le ciel reste dégagé",", nous pourrons observer les planètes.","Subjonctif",3,"La circonstancielle de condition ouvre une perspective : le locuteur exprime le souhait que le ciel reste dégagé.","Phrase construite"],["La Marquise s’étonne ","parce qu’elle découvre l’immensité de l’univers",".","Indicatif",0,"La circonstancielle de cause décrit la situation qui explique le fait principal.","Phrase construite"]];const options=['La description d’une situation','Une perspective : anticipation chronologique','Une perspective : intention','Une perspective : souhait','Une perspective : situation contraire à ce qui est normalement attendu'];const states=[];data.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h3>Phrase '+(i+1)+'</h3><p class="sentence"></p><small></small><p class="mode"></p><label for="q'+i+'">Pourquoi ce mode est-il employé ?</label><select id="q'+i+'"><option value="">Choisis une justification</option></select><div><button>Valider ma réponse</button></div><p class="feedback" aria-live="polite"></p><div class="correction" hidden></div>';const m=document.createElement('mark');m.textContent=d[1];a.querySelector('.sentence').append(document.createTextNode(d[0]),m,document.createTextNode(d[2]));a.querySelector('small').textContent=d[6];a.querySelector('.mode').textContent='Mode employé : '+d[3];const s=a.querySelector('select'),f=a.querySelector('.feedback'),c=a.querySelector('.correction');options.forEach((o,j)=>s.add(new Option(o,String(j))));function check(){if(s.value===''){f.textContent='Choisis une justification.';c.hidden=true;return false}const ok=Number(s.value)===d[4];f.textContent=ok?'✓ Bonne réponse !':'✗ Réponse incorrecte';f.style.color=ok?'#24734c':'#a43d39';c.replaceChildren();const b=document.createElement('strong');b.textContent=options[d[4]];const p=document.createElement('p');p.textContent=d[5];c.append(b,p);c.hidden=false;return ok}function reset(){s.value='';f.textContent='';c.hidden=true}s.onchange=()=>{f.textContent='';c.hidden=true};a.querySelector('button').onclick=check;states.push({check,reset});document.querySelector('#grid').append(a)});document.querySelector('#score').onclick=()=>document.querySelector('#result').textContent='Score : '+states.filter(s=>s.check()).length+' / '+states.length;document.querySelector('#reset').onclick=()=>{states.forEach(s=>s.reset());document.querySelector('#result').textContent=''}</script></body></html>
