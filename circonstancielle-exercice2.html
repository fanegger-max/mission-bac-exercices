<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identifier la valeur des circonstancielles</title><style>*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:12px;font:16px/1.6 system-ui;color:#2b2d42}main{background:#e3eefb;border-radius:20px;padding:20px}h2,h3{color:#285c98} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:white;border-radius:14px;padding:16px;min-width:0}mark{background:#c5dcf8;color:#183c68;border-radius:4px;padding:2px}select,button{font:inherit;border:1px solid #c5d5e7;border-radius:8px;padding:8px;max-width:100%}select{width:100%;background:white;color:#2b2d42}button{cursor:pointer;background:#285c98;color:white;margin:8px 0}small{color:#555} .correction{background:#fff2f8;padding:12px;border-radius:10px} @media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main><h2>Exercice 2 — Identifier la valeur des circonstancielles</h2><p>Pour chaque phrase, identifie la circonstance exprimée par la proposition surlignée. Observe le mot subordonnant et le sens de la proposition.</p><div class="grid" id="grid"></div><button id="score">Calculer mon score final</button> <button id="reset">Recommencer</button><p id="result" aria-live="polite"></p></main><script>const data=[["Il n’est point à son aise ","quand il n’y est pas",".","Temps","Quand situe le fait dans le temps.","Fontenelle, Premier Soir"],["Le philosophe observe le ciel ","afin qu’il puisse mieux comprendre l’univers",".","But","Afin que introduit l’objectif recherché.","Phrase construite"],["Phaéton monte, ","parce qu’il est tiré par des cordes",", et qu’un poids plus pesant que lui descend.","Cause","Parce que indique la raison de son mouvement.","Fontenelle, Premier Soir"],["","Bien que l’univers soit immense",", le philosophe ne s’en effraie pas.","Opposition / concession","Bien que introduit un fait qui ne produit pas la conséquence attendue.","Phrase construite"],["Il faudrait que les gens de la lune eussent bien de l’esprit, ","s’ils devinaient tout cela",".","Condition","Si introduit une hypothèse.","Fontenelle, Second Soir"],["Du lieu où vous êtes à l’opéra, vous ne voyez pas le théâtre tout-à-fait ","comme il est"," ; on a disposé les décorations et les machines, pour faire de loin un effet agréable.","Comparaison","Comme établit une comparaison entre l’apparence du théâtre et sa réalité.","Fontenelle, Premier Soir (extrait)"],["Voilà l’univers si grand ","que je m’y perds",", je ne sais plus où je suis, je ne suis plus rien.","Conséquence","Le système si… que exprime le résultat de cette immensité.","Fontenelle, Cinquième Soir"],["","Quand le ciel n’était que cette voûte bleue, où les étoiles étaient clouées",", l’univers me paraissait petit et étroit, je m’y sentais comme oppressé.","Temps","Quand situe dans le temps la perception de l’univers.","Fontenelle, Cinquième Soir"],["Le philosophe multiplie les exemples ","pour que la Marquise comprenne son raisonnement",".","But","Pour que indique l’intention du philosophe.","Phrase construite"],["La Marquise s’étonne ","parce qu’elle découvre l’immensité de l’univers",".","Cause","Parce que donne la raison de son étonnement.","Phrase construite"],["La Marquise s’épouvante ","alors que le philosophe se réjouit",".","Opposition / concession","Alors que oppose les réactions des deux personnages.","Phrase construite"],["","Si les étoiles fixes sont autant de soleils",", elles peuvent éclairer d’autres planètes.","Condition","Si pose une hypothèse.","Phrase construite"],["Le philosophe examine la nature ","comme un machiniste examine les ressorts du théâtre",".","Comparaison","Comme rapproche deux démarches d’observation.","Phrase construite"],["Les cordes sont parfaitement bien cachées, et elles le sont si bien ","qu’on a été longtemps à deviner ce qui causait les mouvements de l’univers",".","Conséquence","Si bien… que exprime l’effet de la dissimulation des cordes.","Fontenelle, Premier Soir (extrait)"]];const options=['Cause','But','Temps','Opposition / concession','Condition','Comparaison','Conséquence'];const states=[];data.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h3>Phrase '+(i+1)+'</h3><p class="sentence"></p><small></small><p><label for="q'+i+'">Valeur de la circonstancielle</label><select id="q'+i+'"><option value="">Choisis une réponse</option></select></p><button>Valider ma réponse</button><div class="feedback" aria-live="polite"></div><div class="correction" hidden></div>';const p=a.querySelector('.sentence'),m=document.createElement('mark');m.textContent=d[1];p.append(document.createTextNode(d[0]),m,document.createTextNode(d[2]));a.querySelector('small').textContent=d[5];const s=a.querySelector('select'),f=a.querySelector('.feedback'),c=a.querySelector('.correction');options.forEach(o=>s.add(new Option(o,o)));function check(){if(!s.value){f.textContent='Choisis une réponse.';c.hidden=true;return false}const ok=s.value===d[3];f.textContent=ok?'✓ Bonne réponse !':'✗ Réponse incorrecte';f.style.color=ok?'#24734c':'#a43d39';c.textContent='Correction : '+d[3]+'. '+d[4];c.hidden=false;return ok}function reset(){s.value='';f.textContent='';c.hidden=true}s.onchange=()=>{f.textContent='';c.hidden=true};a.querySelector('button').onclick=check;states.push({check,reset});document.querySelector('#grid').append(a)});document.querySelector('#score').onclick=()=>document.querySelector('#result').textContent='Score : '+states.filter(s=>s.check()).length+' / '+states.length;document.querySelector('#reset').onclick=()=>{states.forEach(s=>s.reset());document.querySelector('#result').textContent=''}</script></body></html>
