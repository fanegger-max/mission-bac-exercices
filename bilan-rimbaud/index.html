<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Me tester — Cahiers de Douai</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#fafafa;color:#2b2d42;margin:0}main{max-width:1100px;margin:auto;padding:20px}header,article{background:white;border:1px solid #fde3df;border-radius:16px;padding:18px}header{background:#fde3df;margin-bottom:20px}h1,h2{color:#a93e32}h1{font-size:1.7rem}#questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}button{font:inherit;cursor:pointer;border:1px solid #ccc;border-radius:9px;padding:10px;background:white;color:#2b2d42}article button{display:block;width:100%;text-align:left;margin:6px 0}button:disabled{cursor:default;opacity:1}.good{background:#dff3e5;border-color:#36844e}.bad{background:#fce0e0;border-color:#b84343}.feedback{font-size:.92rem}#score{font-weight:bold;color:#a93e32}a{color:#a93e32}@media(max-width:680px){#questions{grid-template-columns:1fr}}</style><main><header><img src="https://missionbacfrancais.wordpress.com/wp-content/uploads/2026/11/mascotte-methodes-ecrit.png" width="76" alt="" style="float:right"><h1>Me tester — Cahiers de Douai</h1><p>20 questions pour vérifier tes connaissances. Choisis une seule réponse par question.</p><p id="score" aria-live="polite"></p><button id="reset">Recommencer</button></header><div id="questions"></div><p><a href="https://missionbacfrancais.fr/cahiers-de-douai-cours-et-explications/">Revenir au cours</a></p></main><script>const data=[{"q":"En quelle année les poèmes des Cahiers de Douai sont-ils confiés à Demeny ?","opts":["1854","1870","1871","1873"],"k":1,"e":"Les deux ensembles sont confiés à Demeny en 1870."},{"q":"Combien de poèmes composent le recueil ?","opts":["22","15","7","11"],"k":0,"e":"Quinze poèmes puis sept autres."},{"q":"Quel professeur encourage Rimbaud ?","opts":["Paul Demeny","Paul Verlaine","Victor Hugo","Georges Izambard"],"k":3,"e":"Izambard est son professeur de rhétorique."},{"q":"Combien de sonnets compte le recueil ?","opts":["22","7","11","15"],"k":2,"e":"La moitié des poèmes sont des sonnets."},{"q":"Quel événement historique éclaire la dénonciation de la guerre ?","opts":["La révolution de 1830","La guerre franco-prussienne","La révolution de 1848","La guerre de Crimée"],"k":1,"e":"La guerre éclate en juillet 1870."},{"q":"Que demande Rimbaud à Demeny en 1871 ?","opts":["De brûler les poèmes","De publier les poèmes","De les traduire","De les envoyer à Izambard"],"k":0,"e":"Rimbaud demande la destruction des manuscrits."},{"q":"Quel est le parcours associé ?","opts":["Le goût de la science","Anatomie des passions","La comédie sociale","Émancipations créatrices"],"k":3,"e":"Le parcours associe liberté et création."},{"q":"Dans quel poème apparaît le Petit-Poucet rêveur ?","opts":["Roman","Sensation","Ma Bohème","Le Mal"],"k":2,"e":"Le vagabond égrène des rimes."},{"q":"Quel poème dénonce la misère des enfants affamés ?","opts":["À la musique","Les Effarés","Roman","Rage de Césars"],"k":1,"e":"Les enfants contemplent le pain du boulanger."},{"q":"Dans quel poème Rimbaud caricature-t-il les bourgeois de Charleville ?","opts":["À la musique","Soleil et Chair","Sensation","Ma Bohème"],"k":0,"e":"Le portrait satirique vise les conventions bourgeoises."},{"q":"Que signifie l’émancipation dans le parcours ?","opts":["Respecter les conventions","Imiter sans changement","Renoncer à écrire","S’affranchir des contraintes"],"k":3,"e":"Elle concerne notamment les contraintes politiques, religieuses et familiales."},{"q":"Quel effet produit la fin du Dormeur du val ?","opts":["La guérison du soldat","Le réveil du soldat","La révélation de la mort du soldat","Le retour du soldat au combat"],"k":2,"e":"Les deux trous rouges révèlent la mort."},{"q":"Que dénoncent les tercets du Mal ?","opts":["Les difficultés de la fugue","L’indifférence divine et l’hypocrisie religieuse","La mélancolie amoureuse","La pauvreté du poète"],"k":1,"e":"Le Dieu du sonnet reste indifférent aux souffrances."},{"q":"Quel rôle joue la nature dans Ma Bohème ?","opts":["Refuge et source d’inspiration","Obstacle au voyage","Décor hostile","Symbole de l’ordre bourgeois"],"k":0,"e":"La nature protège le poète et nourrit sa création."},{"q":"Quel procédé rapproche les étoiles et un doux frou-frou ?","opts":["L’anaphore","L’antithèse","L’hyperbole","La synesthésie"],"k":3,"e":"Les sensations visuelles et auditives se mêlent."},{"q":"Que représente le jambon dans Au Cabaret-Vert ?","opts":["Le luxe aristocratique","Le sacrifice religieux","Les plaisirs simples du quotidien","La gloire militaire"],"k":2,"e":"Le quotidien devient matière poétique."},{"q":"Que tourne en ridicule L’Éclatante Victoire de Sarrebrück ?","opts":["La poésie amoureuse","La propagande impériale","La vie paysanne","La curiosité scientifique"],"k":1,"e":"Le titre et les images satirisent la propagande."},{"q":"Quelle tonalité domine la dénonciation de la misère dans Les Effarés ?","opts":["Pathétique","Épique","Fantastique","Comique"],"k":0,"e":"Le poème suscite la compassion."},{"q":"Comment Rimbaud renouvelle-t-il les formes traditionnelles ?","opts":["En supprimant tous les sonnets","En refusant toute référence littéraire","En reproduisant strictement ses modèles","En les détournant"],"k":3,"e":"Il conserve des formes héritées tout en les transformant."},{"q":"Que montre l’expression « Oh ! là ! là ! » dans Ma Bohème ?","opts":["Le respect d’un registre solennel","Le recours au vocabulaire scientifique","L’introduction de l’oralité dans le sonnet","L’effacement du locuteur"],"k":2,"e":"L’interjection familière renouvelle le langage poétique."}];let score=0,done=0;const root=document.querySelector('#questions');function refresh(){document.querySelector('#score').textContent='Score : '+score+'/20 — '+done+'/20 réponses'+(done===20?' — Bilan terminé !':'')}function init(){score=done=0;root.replaceChildren();data.forEach((v,i)=>{const a=document.createElement('article');const h=document.createElement('h2');h.style.fontSize='1rem';h.textContent=(i+1)+'. '+v.q;a.append(h);const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');const bs=v.opts.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{done++;if(j===v.k)score++;bs.forEach((z,k)=>{z.disabled=true;if(k===v.k)z.classList.add('good');else if(k===j)z.classList.add('bad')});f.textContent=(j===v.k?'Bonne réponse ! ':'À revoir. ')+v.e;refresh()};a.append(b);return b});a.append(f);root.append(a)});refresh()}document.querySelector('#reset').onclick=init;init();</script></html>
