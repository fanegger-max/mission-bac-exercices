<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les figures de construction — Mission Bac Français</title><style>*{box-sizing:border-box}body{font:17px/1.6 system-ui,sans-serif;color:#2b2d42;background:#e3eefb;max-width:1000px;margin:auto;padding:20px}h1,h2{color:#285c98}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}article{background:white;border-radius:16px;padding:18px}button{font:inherit;border:1px solid #285c98;border-radius:9px;padding:8px 12px;background:white;color:#285c98;cursor:pointer;margin:4px}button:disabled{opacity:1;cursor:default}button.good{background:#d9f3df;color:#165c30}button.bad{background:#fbe0df;color:#9c2626}small{display:block;color:#59637b}#score{font-weight:bold}a{color:#285c98}</style><h1>Les figures de construction — Me tester</h1><p>Identifie la figure ciblée par la question. Une seule réponse attendue. Certains extraits peuvent comporter plusieurs procédés.</p><p id="score" role="status"></p><main id="quiz"></main><p><button id="reset">Recommencer</button> <a href="https://missionbacfrancais.fr/les-figures-de-style/#construction">Revenir au cours</a></p><script>const qs=[["Cela me confond, me trouble, m’épouvante.","Fontenelle, Cinquième Soir","Gradation","Les verbes expriment une peur croissante."],["Qui produit la richesse en créant la misère","Hugo, Melancholia","Antithèse","Richesse et misère s’opposent."],["La beauté sur les fronts, dans les cœurs la pensée","Hugo, Melancholia","Chiasme","Nom + complément, puis complément + nom : ABBA."],["J’accuse le lieutenant-colonel du Paty de Clam […] J’accuse le général Mercier","Zola, J’accuse","Anaphore","La formule ouvre les accusations successives."],["dites-moi, et dites-moi bien sérieusement","Fontenelle, Second Soir","Répétition","La reprise insiste sur la demande."],["De savoir prier Dieu, m’aimer, coudre, et filer.","Molière, L’École des femmes","Énumération","La liste réduit les activités de la femme à quelques tâches."],["Tout est d’airain, tout est de fer.","Hugo, Melancholia","Parallélisme","Les deux propositions reprennent la même structure."],["d’autres visages, d’autres figures, d’autres mœurs","Fontenelle, Second Soir","Énumération","La liste insiste sur la diversité ; elle comporte aussi une anaphore."],["tant d’ardeur pour la liberté, et tant d’inclination à la servitude","Fontenelle, Second Soir","Antithèse","Liberté et servitude soulignent une contradiction humaine."],["donnés au hasard, reçus sans examen et suivis par habitude","Laclos, lettre 81","Parallélisme","Les trois groupes suivent le modèle participe passé + complément."]],options=["Antithèse","Parallélisme","Chiasme","Anaphore","Répétition","Énumération","Gradation"];let score=0,done=0;const root=document.getElementById('quiz');function status(){document.getElementById('score').textContent='Score : '+score+'/'+qs.length+' — '+done+'/'+qs.length+' réponses';}function start(){score=done=0;root.replaceChildren();qs.forEach((q,i)=>{const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('small'),h=document.createElement('strong'),f=document.createElement('p');h.textContent='Question '+(i+1)+(q[2]==='Animalisation'?' — Quel effet de représentation ?':q[0].startsWith('d’autres')?' — Quelle figure de liste ?':q[0].startsWith('donnés')?' — Quelle figure de structure syntaxique ?':q[0].startsWith('tant d’ardeur')?' — Quelle figure d’opposition ?':q[0].startsWith('Tout est')?' — Quelle figure de structure ?':q[0].startsWith('Cela me')?' — Quelle figure d’intensité croissante ?':'');p.textContent='« '+q[0]+' »';s.textContent=q[1];a.append(h,p,s);f.setAttribute('role','status');let bs=[];options.forEach(o=>{let b=document.createElement('button');b.textContent=o;bs.push(b);a.append(b);b.onclick=()=>{done++;if(o===q[2])score++;bs.forEach(x=>{x.disabled=true;if(x.textContent===q[2])x.classList.add('good');});if(o!==q[2])b.classList.add('bad');f.textContent=(o===q[2]?'Bravo ! ':'Réponse attendue : '+q[2]+'. ')+q[3];status();};});a.append(f);root.append(a);});status();}document.getElementById('reset').onclick=start;start();</script></html>
