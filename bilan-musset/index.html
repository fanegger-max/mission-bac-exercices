<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Me tester — On ne badine pas avec l’amour</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#fafafa;color:#2b2d42;margin:0}main{max-width:1100px;margin:auto;padding:20px}header,article{background:white;border:1px solid #fde6eb;border-radius:16px;padding:18px}header{background:#fde6eb;margin-bottom:20px}h1,h2,a,#score{color:#86425c}h1{font-size:1.7rem}#questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}button{font:inherit;cursor:pointer;border:1px solid #ccc;border-radius:9px;padding:10px;background:white;color:#2b2d42}article button{display:block;width:100%;text-align:left;margin:6px 0}button:disabled{cursor:default;opacity:1}.good{background:#dff3e5;border-color:#36844e}.bad{background:#fce0e0;border-color:#b84343}.feedback{font-size:.92rem}#score{font-weight:bold}@media(max-width:680px){#questions{grid-template-columns:1fr}}

</style><main><header><img src="https://missionbacfrancais.wordpress.com/wp-content/uploads/2026/11/mascotte-methodes-ecrit.png" width="76" alt="" style="float:right"><h1>Me tester — On ne badine pas avec l’amour</h1><p>20 questions pour vérifier tes connaissances. Choisis une seule réponse par question.</p><p id="score" aria-live="polite"></p><button id="reset">Recommencer</button></header><div id="questions"></div><p><a href="https://missionbacfrancais.fr/on-ne-badine-pas-avec-lamour-cours-et-explications/">Revenir au cours</a></p></main><script>const data=[{"q":"En quelle année paraît On ne badine pas avec l’amour ?","opts":["1830","1834","1836","1857"],"k":1,"e":"La pièce paraît en 1834."},{"q":"À quel mouvement appartient Musset ?","opts":["Romantisme","Classicisme","Réalisme","Symbolisme"],"k":0,"e":"Musset est un auteur romantique."},{"q":"Quelle écrivaine inspire notamment la pièce ?","opts":["Louise Labé","Madame de Lafayette","Marceline Desbordes-Valmore","George Sand"],"k":3,"e":"La liaison avec George Sand nourrit la pièce."},{"q":"Que signifie Un spectacle dans un fauteuil ?","opts":["Un théâtre réservé aux salons royaux","Une pièce respectant les trois unités","Un théâtre pensé pour la lecture","Un spectacle sans dialogue"],"k":2,"e":"Musset explore un théâtre destiné à être lu."},{"q":"Quel genre le titre évoque-t-il ?","opts":["La farce médiévale","Le proverbe dramatique","La tragédie classique","Le vaudeville"],"k":1,"e":"Le titre formule une leçon illustrée par l’intrigue."},{"q":"Quel projet annonce le Baron ?","opts":["Marier Camille et Perdican","Envoyer Perdican au couvent","Marier Rosette à Blazius","Faire partir Camille à Paris"],"k":0,"e":"Le mariage des cousins constitue l’enjeu initial."},{"q":"Quelle éducation Camille a-t-elle reçue ?","opts":["Universitaire à Paris","Militaire","Artistique au théâtre","Religieuse au couvent"],"k":3,"e":"Camille revient du couvent."},{"q":"Quelle formation Perdican a-t-il reçue ?","opts":["Religieuse au couvent","Militaire","Universitaire","Artisanale"],"k":2,"e":"Perdican revient de Paris avec un doctorat."},{"q":"Quel lien unit Rosette et Camille ?","opts":["Elles sont cousines germaines","Elles sont sœurs de lait","Elles sont mère et fille","Elles sont camarades de couvent"],"k":1,"e":"La mère de Rosette a nourri Camille."},{"q":"Quels personnages incarnent notamment le grotesque ?","opts":["Blazius, Bridaine et Dame Pluche","Camille, Perdican et Rosette","Le Baron, Camille et Rosette","Perdican, Camille et le chœur"],"k":0,"e":"Les fantoches contribuent au comique."},{"q":"Quel obstacle principal empêche l’union des cousins ?","opts":["Une interdiction du Baron","Le manque d’argent de Perdican","Une guerre entre leurs familles","Leur orgueil et leur méfiance"],"k":3,"e":"L’obstacle est intérieur aux jeunes gens."},{"q":"Que refuse Camille dans le premier extrait ?","opts":["De retourner au couvent","De parler à Dame Pluche","De retrouver les lieux de leur enfance","De lire une lettre du Baron"],"k":2,"e":"Elle repousse les invitations nostalgiques de Perdican."},{"q":"Pourquoi Perdican parle-t-il à haute voix devant Rosette ?","opts":["Pour appeler le Baron","Pour que Camille l’entende","Pour avertir le chœur","Pour se faire entendre de Blazius"],"k":1,"e":"Camille est cachée et constitue la destinataire indirecte."},{"q":"Quel objet Perdican jette-t-il dans la fontaine ?","opts":["La bague offerte par Camille","Sa chaîne d’or","Une lettre de Rosette","Un livre de prières"],"k":0,"e":"Le geste vise à blesser Camille."},{"q":"Quelle notion théâtrale désigne une parole destinée au public mais non entendue par certains personnages ?","opts":["La stichomythie","La tirade","Le dénouement","L’aparté"],"k":3,"e":"Les apartés de Camille révèlent ses réactions."},{"q":"Dans l’oratoire, quel défaut Perdican accuse-t-il ?","opts":["L’avarice","La paresse","L’orgueil","La naïveté"],"k":2,"e":"Il apostrophe l’orgueil, responsable de leur séparation."},{"q":"À quoi Perdican compare-t-il le bonheur ?","opts":["À une rose fanée","À une perle rare","À un miroir brisé","À une flamme éternelle"],"k":1,"e":"La métaphore souligne la valeur du bonheur perdu."},{"q":"Quel événement rend le dénouement tragique ?","opts":["La mort de Rosette","Le départ du Baron","Le mariage des cousins","Le retour de Blazius"],"k":0,"e":"Rosette est victime des jeux amoureux."},{"q":"Pourquoi Araminte dicte-t-elle une lettre à Dorante ?","opts":["Pour lui annoncer son renvoi","Pour régler définitivement un procès","Pour lui confier un secret de Dubois","Pour éprouver ses sentiments"],"k":3,"e":"Le stratagème vise à provoquer un aveu."},{"q":"Quel enjeu relie les extraits de Musset et de Marivaux ?","opts":["La défense des unités classiques","La critique de la guerre","La parole comme moyen d’éprouver les sentiments","La transmission du savoir scientifique"],"k":2,"e":"Les stratagèmes amoureux mettent en tension sincérité et manipulation."}];let score=0,done=0;const root=document.querySelector('#questions');function refresh(){document.querySelector('#score').textContent='Score : '+score+'/20 — '+done+'/20 réponses'+(done===20?' — Bilan terminé !':'')}function init(){score=done=0;root.replaceChildren();data.forEach((v,i)=>{const a=document.createElement('article');const h=document.createElement('h2');h.style.fontSize='1rem';h.textContent=(i+1)+'. '+v.q;a.append(h);const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');const bs=v.opts.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{done++;if(j===v.k)score++;bs.forEach((z,k)=>{z.disabled=true;if(k===v.k)z.classList.add('good');else if(k===j)z.classList.add('bad')});f.textContent=(j===v.k?'Bonne réponse ! ':'À revoir. ')+v.e;refresh()};a.append(b);return b});a.append(f);root.append(a)});refresh()}document.querySelector('#reset').onclick=init;init();</script></html>
