<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naïs Micoulin — TTI</title><style>body{font:17px/1.6 system-ui,sans-serif;background:#f6f8fc;color:#233047;margin:0}main{max-width:1150px;margin:auto;padding:20px}h1,h2,a{color:#285c98}.panel{background:#fde3df;border-radius:20px;padding:20px;margin:16px 0}table{width:100%;border-collapse:collapse;background:white;table-layout:fixed}th,td{padding:12px;border:1px solid #cbd8e8;vertical-align:top;text-align:left;overflow-wrap:anywhere}th{background:#e3eefb;color:#285c98}select,button{font:inherit;padding:10px;border:1px solid #9fb2c9;border-radius:8px;max-width:100%}select{width:100%;background:white}button{cursor:pointer;background:#285c98;color:white;margin:8px 8px 8px 0} .ok{background:#e0f1ea}.bad{background:#fff0ee}.feedback{font-size:.9rem;margin-top:8px} .bank{background:white;border-radius:12px;padding:12px;margin:12px 0}details summary{cursor:pointer;color:#285c98;font-weight:bold}@media(max-width:650px){table,tbody,tr,td{display:block;width:auto}thead{display:none}td:before{content:attr(data-label);display:block;color:#285c98;font-weight:bold}tr{margin-bottom:14px;border:1px solid #cbd8e8}main{padding:10px}}</style><main><a href="https://missionbacfrancais.fr/atelier-analyse-nais-micoulin/#etape-5">← Retour à l’atelier</a><h1>Interpréter le texte : <em>Naïs Micoulin</em></h1><div class="panel"><strong>TTI : Texte → Technique → Interprétation</strong><p>Pour chaque citation, sélectionne la technique ou l’interprétation manquante. Vérifie tes réponses puis corrige tes erreurs. Les quatre dernières lignes proposent de nouveaux relevés.</p></div><div id="exercise"></div><button id="check">Vérifier mes réponses</button><button id="reset">Recommencer</button><p id="score" role="status"></p></main><script>const rows=[["Ils <b>partirent</b>, ils <b>disparurent</b> derrière les rochers. Naïs <b>se leva</b> brusquement et les <b>suivit</b> à distance,","Emploi du passé simple, succession d’actions rapides","Récit très dynamique qui met en valeur l’enchaînement rapide des actions des personnages afin de créer une tension dramatique."],["Au lieu de rester dans <b>le sentier</b>, au fond de <b>la gorge</b>, elle se jeta vers la gauche, parmi <b>des buissons</b>, pressant le pas, évitant de faire rouler <b>les pierres</b>.","Champ lexical de la nature","L’action se déroule dans une nature aride et qui peut être dangereuse."],["Naïs, qui se glissait de buisson en buisson, était venue se placer, <b>anxieuse</b>, derrière le vieux.","Adjectif apposé","La tension dramatique est mise en valeur par le sentiment d’oppression ressenti par le personnage de Naïs."],["Les minutes <b>s’écoulaient</b>.","Phrase brève à l’imparfait, temps qui exprime la durée d’une action.","La tension est palpable car le temps semble parfois s’arrêter, comme suspendu dans l’attente de l’action violente du père Micoulin."],["Mais, d’un <b>coup de pied</b>, Naïs avait haussé le canon, et la charge partit en l’air, avec une <b>détonation terrible</b>, qui roula dans les échos de la gorge.","Champ lexical de la violence","La violence de la fille fait écho à la violence du père qui a voulu tuer Frédéric."],["La jeune fille se tenait debout, toute blanche, avec des yeux <b>qui jetaient des flammes</b>.","Métaphore","La colère est perceptible dans l’attitude de la jeune fille."],["« <b>Va, va</b>, je le <b>tuerai</b>. »","Répétition et emploi du futur simple","Le danger de mort imminente est passé, mais il reste présent par la menace explicite formulée par le père."],["<b>brute têtue et tranquille</b>","Nom et adjectifs péjoratifs","Le portrait final du père souligne le danger qui demeure car la violence qu’il exprime s’oppose à son apparente tranquillité."],["Naïs se leva <b>brusquement</b>","Adverbe de manière","La soudaineté du geste révèle la détermination de Naïs à suivre les chasseurs."],["<b>Elle ne voyait toujours pas son père.</b>","Négation et adverbe temporel","Le lecteur partage l’incertitude de Naïs : l’absence du père dans son champ de vision entretient le suspense."],["<b>Mais</b>, d’un coup de pied, Naïs avait haussé le canon","Connecteur d’opposition","Le récit bascule : l’intervention de Naïs déjoue le projet de son père."],["La jeune fille se tenait debout, <b>toute blanche</b>","Adjectif de couleur renforcé par un adverbe","La pâleur manifeste physiquement l’émotion intense de Naïs."]];const root=document.querySelector('#exercise');function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function build(){root.innerHTML='';for(const [start,end,title] of [[0,8,'1. Retrouver les techniques et les interprétations'],[8,12,'2. Aller plus loin : nouveaux relevés']]){const section=document.createElement('section');section.innerHTML='<h2>'+title+'</h2><table><thead><tr><th>Texte</th><th>Technique</th><th>Interprétation</th></tr></thead><tbody></tbody></table>';const tbody=section.querySelector('tbody');for(let i=start;i<end;i++){const tr=document.createElement('tr');for(let j=0;j<3;j++){const td=document.createElement('td');td.dataset.label=['Texte','Technique','Interprétation'][j];const missing=j>0&&(i>=8?j===2:j===(i%2===0?1:2));if(!missing){td.innerHTML=rows[i][j]}else{const sel=document.createElement('select');sel.setAttribute('aria-label',td.dataset.label+' ligne '+(i+1));sel.dataset.answer=i;sel.dataset.col=j;sel.add(new Option('Choisir une réponse…',''));for(const k of shuffle(Array.from({length:end-start},(_,n)=>n+start)))sel.add(new Option(rows[k][j],k));td.append(sel);const f=document.createElement('div');f.className='feedback';td.append(f);sel.onchange=()=>{td.classList.remove('ok','bad');f.textContent='';document.querySelector('#score').textContent=''}}tr.append(td)}tbody.append(tr)}root.append(section)}}build();document.querySelector('#check').onclick=()=>{let n=0;const sels=[...root.querySelectorAll('select')];for(const s of sels){const ok=s.value===s.dataset.answer;const td=s.parentElement;td.classList.toggle('ok',ok);td.classList.toggle('bad',!ok);td.querySelector('.feedback').textContent=ok?'✓ Bonne réponse':s.value?'À revoir : relis la citation et la cellule déjà complétée.':'Choisis une réponse.';n+=ok?1:0}document.querySelector('#score').textContent=n+' / '+sels.length+' réponses correctes. '+(n===sels.length?'Bravo, tableau complété !':'Tu peux modifier tes réponses et vérifier à nouveau.')};document.querySelector('#reset').onclick=()=>{build();document.querySelector('#score').textContent=''};</script></html>
