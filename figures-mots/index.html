<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les figures de mots — Mission Bac Français</title><style>*{box-sizing:border-box}body{font:17px/1.6 system-ui,sans-serif;color:#2b2d42;background:#fde3df;max-width:1000px;margin:auto;padding:20px}h1,h2{color:#285c98}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}article{background:white;border-radius:16px;padding:18px}button{font:inherit;border:1px solid #285c98;border-radius:9px;padding:8px 12px;background:white;color:#285c98;cursor:pointer;margin:4px}button:disabled{opacity:1;cursor:default}button.good{background:#d9f3df;color:#165c30}button.bad{background:#fbe0df;color:#9c2626}small{display:block;color:#59637b}#score{font-weight:bold}a{color:#285c98}
/* Harmonisation graphique Mission Bac Français */
body{font-size:16px;line-height:1.7}
body{box-sizing:border-box;width:100%;max-width:1100px;margin:0 auto;padding:24px}
article{border-radius:24px;padding:24px}

</style><h1>Les figures de mots — Me tester</h1><p>Identifie la figure ciblée par la question. Une seule réponse attendue. Certains extraits peuvent comporter plusieurs procédés.</p><p id="score" role="status"></p><main id="quiz"></main><p><button id="reset">Recommencer</button> <a href="https://missionbacfrancais.fr/les-figures-de-style/#mots">Revenir au cours</a></p><script>const qs=[["un malheur qui n’eut jamais d’exemple","Prévost, Manon Lescaut","Hyperbole","Des Grieux présente sa souffrance comme sans précédent."],["et cent autres rêveries","Fontenelle, Premier Soir","Hyperbole","Le nombre amplifie la multiplicité des théories anciennes."],["J’ai imaginé le moment mille fois","Andrea, Cent millions d’années et un jour","Hyperbole","Le nombre exprime le caractère obsessionnel de la quête."],["un récit qui me tue","Prévost, Manon Lescaut","Hyperbole","Le récit provoque une souffrance extrême."],["Obscure clarté","Exemple du cours","Oxymore","Deux mots de sens opposés sont réunis."],["soleil noir","Exemple du cours","Oxymore","Le soleil évoque la lumière, opposée au noir."]],options=["Hyperbole","Oxymore"];let score=0,done=0;const root=document.getElementById('quiz');function status(){document.getElementById('score').textContent='Score : '+score+'/'+qs.length+' — '+done+'/'+qs.length+' réponses';}function start(){score=done=0;root.replaceChildren();qs.forEach((q,i)=>{const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('small'),h=document.createElement('strong'),f=document.createElement('p');h.textContent='Question '+(i+1)+(q[2]==='Animalisation'?' — Quel effet de représentation ?':q[0].startsWith('d’autres')?' — Quelle figure de liste ?':q[0].startsWith('donnés')?' — Quelle figure de structure syntaxique ?':q[0].startsWith('tant d’ardeur')?' — Quelle figure d’opposition ?':q[0].startsWith('Tout est')?' — Quelle figure de structure ?':q[0].startsWith('Cela me')?' — Quelle figure d’intensité croissante ?':'');p.textContent='« '+q[0]+' »';s.textContent=q[1];a.append(h,p,s);f.setAttribute('role','status');let bs=[];options.forEach(o=>{let b=document.createElement('button');b.textContent=o;bs.push(b);a.append(b);b.onclick=()=>{done++;if(o===q[2])score++;bs.forEach(x=>{x.disabled=true;if(x.textContent===q[2])x.classList.add('good');});if(o!==q[2])b.classList.add('bad');f.textContent=(o===q[2]?'Bravo ! ':'Réponse attendue : '+q[2]+'. ')+q[3];status();};});a.append(f);root.append(a);});status();}document.getElementById('reset').onclick=start;start();</script></html>
