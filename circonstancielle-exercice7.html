<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilan — Les circonstancielles</title><style>*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:12px;font:16px/1.6 system-ui;color:#28334a}main{background:#e3eefb;padding:20px;border-radius:20px}article{background:white;padding:18px;border-radius:14px;margin:16px 0}h2,h3,legend{color:#285c98}button,select{font:inherit;border:1px solid #b6cbe2;border-radius:8px;padding:7px;cursor:pointer;background:#f5f8fc;color:inherit}button.action{background:#285c98;color:white}fieldset{border:1px solid #dbe8f5;border-radius:10px;margin:12px 0;padding:12px}legend{font-weight:bold}select{max-width:100%;width:100%}.words{line-height:2.9}.bank,.target{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;border:1px dashed #9bb5d0;border-radius:8px;padding:8px;margin:6px 0}.tile{background:#e3eefb}.correction{background:#fff2f8;padding:14px;border-radius:10px;margin-top:12px}.active{background:#285c98;color:white}[hidden]{display:none!important}small{color:#555}</style></head><body><main><h2>Exercice 7 — Bilan et préparation au bac</h2><p>Analyse chaque phrase en suivant les étapes. Les cinq phrases sont construites autour des thèmes de Fontenelle et ne sont pas des citations. Clique sur les mots, puis manipule les étiquettes. Chaque phrase vaut 9 points.</p><div id="grid"></div><button class="action" id="score">Calculer mon score final</button> <button id="reset">Recommencer</button><p id="result" aria-live="polite"></p></main><script>const data=[{"p":"Les astronomes perfectionnent leurs instruments parce que les observations anciennes manquent de précision.","v":["perfectionnent","manquent"],"m":["parce","que"],"s":"parce que les observations anciennes manquent de précision.","type":"Cause","mode":"Indicatif","why":0,"main":"Les astronomes perfectionnent leurs instruments","sub":"parce que les observations anciennes manquent de précision","rep":"en raison du manque de précision des observations anciennes","bad":"malgré leur précision","tests":[true,true,true],"move":"Parce que les observations anciennes manquent de précision, les astronomes perfectionnent leurs instruments.","del":"Les astronomes perfectionnent leurs instruments.","replace":"Les astronomes perfectionnent leurs instruments en raison du manque de précision des observations anciennes."},{"p":"Le philosophe ferma son livre lorsque les premières lueurs de l’aube éclairèrent le jardin.","v":["ferma","éclairèrent"],"m":["lorsque"],"s":"lorsque les premières lueurs de l’aube éclairèrent le jardin.","type":"Temps","mode":"Indicatif","why":0,"main":"Le philosophe ferma son livre","sub":"lorsque les premières lueurs de l’aube éclairèrent le jardin","rep":"aux premières lueurs de l’aube","bad":"malgré les premières lueurs","tests":[true,true,true],"move":"Lorsque les premières lueurs de l’aube éclairèrent le jardin, le philosophe ferma son livre.","del":"Le philosophe ferma son livre.","replace":"Le philosophe ferma son livre aux premières lueurs de l’aube."},{"p":"La Marquise note ses observations de manière à ce que ses amis puissent les examiner.","v":["note","puissent"],"m":["de","manière","à","ce","que"],"s":"de manière à ce que ses amis puissent les examiner.","type":"But","mode":"Subjonctif","why":2,"main":"La Marquise note ses observations","sub":"de manière à ce que ses amis puissent les examiner","rep":"en vue de leur examen par ses amis","bad":"à cause de ses amis","tests":[true,true,true],"move":"De manière à ce que ses amis puissent les examiner, la Marquise note ses observations.","del":"La Marquise note ses observations.","replace":"La Marquise note ses observations en vue de leur examen par ses amis."},{"p":"Quoique le voyage paraisse impossible, la Marquise rêve de visiter les planètes.","v":["paraisse","rêve"],"m":["Quoique"],"s":"Quoique le voyage paraisse impossible,","type":"Opposition / concession","mode":"Subjonctif","why":4,"main":"la Marquise rêve de visiter les planètes","sub":"Quoique le voyage paraisse impossible","rep":"malgré l’apparente impossibilité du voyage","bad":"grâce à la facilité du voyage","tests":[true,true,true],"move":"La Marquise rêve de visiter les planètes, quoique le voyage paraisse impossible.","del":"La Marquise rêve de visiter les planètes.","replace":"Malgré l’apparente impossibilité du voyage, la Marquise rêve de visiter les planètes."},{"p":"La comète brillait d’un tel éclat que tous les promeneurs levèrent les yeux.","v":["brillait","levèrent"],"m":["que"],"s":"que tous les promeneurs levèrent les yeux.","type":"Conséquence","mode":"Indicatif","why":0,"main":"La comète brillait d’un tel éclat","sub":"que tous les promeneurs levèrent les yeux","tests":[false,false,false],"move":"La subordonnée dépend du corrélatif « tel ».","del":"La suppression laisse la relation de conséquence en suspens ou change le sens.","replace":"Le remplacement exige de modifier le système corrélatif tel… que."}];const types=['Cause','But','Temps','Opposition / concession','Condition','Comparaison','Conséquence'],why=['Description d’une situation','Perspective : anticipation chronologique','Perspective : intention','Perspective : souhait','Perspective : situation contraire à ce qui est normalement attendu'];const states=[];const norm=w=>w.replace(/[.,;!?]$/,'');const eq=(a,b)=>a.slice().sort((x,y)=>x-y).join()===b.slice().sort((x,y)=>x-y).join();data.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h3>Phrase '+(i+1)+'</h3><small>Phrase construite</small><fieldset><legend>1 à 3. Repérage</legend><p class="tools"></p><p class="words"></p><p class="hint"></p><button class="clear">Effacer les sélections</button></fieldset><fieldset><legend>4. Valeur</legend><select class="type"></select></fieldset><fieldset><legend>5. Manipulations syntaxiques</legend><div class="tests"></div></fieldset><fieldset><legend>6. Mode</legend><select class="mode"></select></fieldset><fieldset><legend>7. Justification</legend><select class="why"></select></fieldset><button class="action validate">Valider mes réponses</button><p class="feedback" aria-live="polite"></p><div class="correction" hidden></div>';const w=d.p.split(' '),v=[],m=[];let range=[],start=null,mode=0;const corr=a.querySelector('.correction'),feedback=a.querySelector('.feedback');function dirty(){corr.hidden=true;feedback.textContent=''}const tools=['Verbes conjugués','Mots subordonnants','Délimiter la circonstancielle'].map((t,j)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{mode=j;start=null;draw()};a.querySelector('.tools').append(b,document.createTextNode(' '));return b});const buttons=w.map((t,j)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(mode<2){const arr=mode===0?v:m,k=arr.indexOf(j);if(k<0)arr.push(j);else arr.splice(k,1)}else if(start===null){start=j;range=[]}else{range=[Math.min(start,j),Math.max(start,j)];start=null}draw()};a.querySelector('.words').append(b,document.createTextNode(' '));return b});function draw(){tools.forEach((b,j)=>b.classList.toggle('active',j===mode));buttons.forEach((b,j)=>{b.style.background=range.length&&j>=range[0]&&j<=range[1]?'#c5dcf8':'#f5f8fc';b.style.textDecoration=v.includes(j)?'underline 3px #24734c':'none';b.style.border=m.includes(j)?'2px solid #ad4976':'1px solid #b6cbe2';b.style.outline=start===j?'2px solid #285c98':''});a.querySelector('.hint').textContent=mode===2?(start===null?'Clique sur le premier mot de la circonstancielle.':'Clique sur son dernier mot.'):'Clique sur les mots à sélectionner.';dirty()}a.querySelector('.clear').onclick=()=>{v.length=m.length=0;range=[];start=null;draw()};function select(cls,opts){const s=a.querySelector(cls);s.add(new Option('Choisis une réponse',''));opts.forEach(o=>s.add(new Option(o,o)));s.onchange=dirty;return s}const ty=select('.type',types),mo=select('.mode',['Indicatif','Subjonctif']),wh=select('.why',why);const ts=['Déplacement','Suppression','Remplacement'].map((t,j)=>{const f=document.createElement('fieldset');f.innerHTML='<legend>'+t+'</legend><select><option value="">Possible ?</option><option value="yes">Oui</option><option value="no">Non</option></select><div class="work" hidden><small>Clique sur les étiquettes pour construire la phrase ; clique à nouveau pour les retirer.</small><div class="bank"></div><div class="target"></div></div>';const s=f.querySelector('select'),work=f.querySelector('.work'),bank=f.querySelector('.bank'),target=f.querySelector('.target');const labels={m:d.main,s:d.sub,r:d.rep||'avec éclat',x:d.bad||'malgré la nuit'};const available=j===2?['x','m','r']:['m','s'];let chosen=[];function render(){bank.replaceChildren();target.replaceChildren();function tile(k,on){const b=document.createElement('button');b.className='tile';b.textContent=labels[k];b.onclick=()=>{chosen=on?chosen.filter(x=>x!==k):[...chosen,k];render()};b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',k);return b}available.filter(k=>!chosen.includes(k)).forEach(k=>bank.append(tile(k,false)));chosen.forEach(k=>target.append(tile(k,true)));dirty()}for(const [zone,on] of [[bank,false],[target,true]]){zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(!available.includes(k))return;chosen=chosen.filter(x=>x!==k);if(on)chosen.push(k);render()}}s.onchange=()=>{work.hidden=s.value!=='yes';render()};a.querySelector('.tests').append(f);return {ok:()=>s.value===(d.tests[j]?'yes':'no')&&(!d.tests[j]||(j===0?chosen.join()===(d.p.startsWith(d.sub)?'m,s':'s,m'):j===1?chosen.join()==='m':['m,r','r,m'].includes(chosen.join()))),reset:()=>{s.value='';chosen=[];work.hidden=true;render()}}});function check(){const vi=w.flatMap((x,j)=>d.v.includes(norm(x))?[j]:[]),mi=w.flatMap((x,j)=>d.m.includes(norm(x))?[j]:[]);const k=d.p.indexOf(d.s),first=d.p.slice(0,k).trim().split(' ').filter(Boolean).length,last=first+d.s.split(' ').length-1;const checks=[eq(v,vi),eq(m,mi),eq(range,[first,last]),ty.value===d.type,...ts.map(t=>t.ok()),mo.value===d.mode,wh.value===why[d.why]];const n=checks.filter(Boolean).length;feedback.textContent=n+' / 9 points';corr.replaceChildren();const h=document.createElement('strong');h.textContent='Correction détaillée';corr.append(h);const labels=['Verbes conjugués','Mots subordonnants','Délimitation','Valeur','Déplacement','Suppression','Remplacement','Mode','Justification'];const explanations=[d.v.join(', '),d.m.join(' '),d.s,d.type,...[d.move,d.del,d.replace].map((x,j)=>(d.tests[j]?'Possible : ':'Impossible : ')+x),d.mode,why[d.why]];labels.forEach((l,j)=>{const p=document.createElement('p'),b=document.createElement('strong');b.textContent=(checks[j]?'✓ ':'✗ ')+l+' : ';b.style.color=checks[j]?'#24734c':'#a43d39';p.append(b,document.createTextNode(explanations[j]));corr.append(p)});const p=document.createElement('p');p.textContent='Réponse possible à l’oral : « '+d.sub+' » est une proposition subordonnée circonstancielle de '+d.type.toLowerCase()+', introduite par '+d.m.join(' ')+'. '+(d.tests[0]?'Les trois manipulations sont possibles.':'Elle appartient à un système corrélatif : les trois manipulations ne sont pas possibles sans modifier la construction ou le sens.')+' Le verbe est à '+(d.mode==='Indicatif'?'l’indicatif : la subordonnée décrit une situation.':'au subjonctif : elle ouvre une '+why[d.why].toLowerCase()+'.');p.textContent=p.textContent.replace('à au','au');corr.append(p);corr.hidden=false;return n}function reset(){v.length=m.length=0;range=[];start=null;mode=0;ty.value=mo.value=wh.value='';ts.forEach(t=>t.reset());draw()}a.querySelector('.validate').onclick=check;states.push({check,reset});document.querySelector('#grid').append(a);draw()});document.querySelector('#score').onclick=()=>document.querySelector('#result').textContent='Score : '+states.reduce((n,s)=>n+s.check(),0)+' / 45';document.querySelector('#reset').onclick=()=>{states.forEach(s=>s.reset());document.querySelector('#result').textContent=''}</script></body></html>
