<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les formes de phrases</title><style>*{box-sizing:border-box}body{background:#fff8ee;color:#2b2d42;font:17px/1.6 system-ui;margin:0}main{max-width:900px;margin:auto;padding:18px}header,section{background:white;border-radius:20px;padding:22px;margin-bottom:18px}header{background:#e3eefb}h1,h2{color:#285c98;line-height:1.3}article{background:#f3f6fa;padding:16px;border-radius:12px;margin:12px 0}button,textarea{font:inherit}button{background:white;color:#285c98;border:1px solid #285c98;border-radius:9px;padding:9px 12px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#285c98;color:white}textarea{width:100%;min-height:76px;border:1px solid #8997aa;border-radius:8px;padding:10px}label{display:block;margin-top:10px}.feedback{background:#fff3d1;padding:12px;border-radius:9px;margin-top:10px}.good{color:#17603a}.bad{color:#a32d29}progress{width:100%;accent-color:#285c98}[hidden]{display:none}nav{display:flex;flex-wrap:wrap;gap:10px}nav a{color:#285c98}</style><main><header><h1>Les formes de phrases</h1><nav><a href="#ex1">1. Identifier</a><a href="#ex2">2. Transformer</a><a href="#ex3">3. Supprimer les formes</a><a href="#ex4">4. Mettre en relief</a><a href="#ex5">5. Cumuler les formes</a></nav><progress id="p" max="15" value="0"></progress><p id="score" aria-live="polite">0 / 15 phrases correctement identifiées</p></header><div id="activities"></div><button id="reset">Tout recommencer</button><p><a href="https://missionbacfrancais.fr/entrainement-types-et-formes-de-phrase/">← Retour au site</a></p></main><script>const a=[["Ce roman a été publié au XIXᵉ siècle.",[2],"Auxiliaire être au passé composé et participe passé publié."],["Comme cette histoire est émouvante !",[1],"Comme exclamatif et point d’exclamation."],["Il reste encore quelques places dans la salle.",[3],"Il impersonnel ; quelques places est le sujet logique."],["C'est cette décision qui a provoqué sa colère.",[4],"Présentatif c’est… qui."],["Je n'ai jamais entendu parler de cet écrivain.",[0],"Négation ne… jamais."],["Cette proposition n'a pas été acceptée par le jury.",[0,2],"Ne… pas ; être au passé composé + participe passé, complément d’agent."],["Ce personnage, je le trouve particulièrement inquiétant.",[4],"Détachement du COD et reprise par le."],["Il est arrivé un étrange événement dans ce village.",[3],"Il impersonnel ; un étrange événement est le sujet logique."],["Que de temps nous avons perdu !",[1],"Que de exclamatif et point d’exclamation."],["Ce n'est pas lui qui a commis cette faute.",[0,4],"Ne… pas et présentatif c’est… qui."],["Il ne manque plus aucun document.",[0,3],"Il impersonnel et négation ne… plus aucun."],["Cette lettre, elle ne l'a jamais ouverte.",[0,4],"Ne… jamais ; COD détaché repris par l’."],["Les coupables seront sévèrement punis.",[2],"Être au futur + participe passé."],["Comme il est difficile de convaincre cet homme !",[1,3],"Comme exclamatif, point d’exclamation et il impersonnel."],["C'est à vous que cette récompense a été décernée.",[2,4],"Présentatif c’est… que et être au passé composé + participe passé."]],b=[["Le narrateur connaît les pensées des personnages.","négative","Le narrateur ne connaît pas les pensées des personnages."],["Les journalistes interrogent le ministre.","passive","Le ministre est interrogé par les journalistes."],["Cette scène est particulièrement touchante.","exclamative","Comme cette scène est touchante !"],["Plusieurs incidents se sont produits pendant la représentation.","impersonnelle","Il s’est produit plusieurs incidents pendant la représentation."],["Paul a découvert la vérité.","emphatique (mise en relief du sujet)","C’est Paul qui a découvert la vérité."],["Le professeur a distribué les copies.","passive","Les copies ont été distribuées par le professeur."],["J'apprécie beaucoup ce poème.","emphatique (mise en relief du COD)","C’est ce poème que j’apprécie beaucoup."],["Elle se souvient encore de cette rencontre.","négative","Elle ne se souvient plus de cette rencontre."],["Une étrange rumeur circule dans le village.","impersonnelle","Il circule une étrange rumeur dans le village."],["Ce personnage est ridicule.","exclamative","Comme ce personnage est ridicule !"],["Le jury a récompensé cette jeune romancière.","passive et négative","Cette jeune romancière n’a pas été récompensée par le jury."],["Tu as choisi ce livre.","emphatique (mise en relief du COD)","C’est ce livre que tu as choisi."],["Plusieurs difficultés subsistent.","impersonnelle et négative","Il ne subsiste aucune difficulté."],["Cette découverte est surprenante.","exclamative","Comme cette découverte est surprenante !"],["Le directeur a pris cette décision.","emphatique et négative (mise en relief du sujet)","Ce n’est pas le directeur qui a pris cette décision."]],c=[["C'est son orgueil qui a provoqué sa chute.","Son orgueil a provoqué sa chute."],["Cette œuvre a été admirée par plusieurs générations de lecteurs.","Plusieurs générations de lecteurs ont admiré cette œuvre."],["Il s'est produit un accident sur cette route.","Un accident s’est produit sur cette route."],["Comme ce spectacle est impressionnant !","Ce spectacle est impressionnant."],["Cette histoire, je la connais depuis longtemps.","Je connais cette histoire depuis longtemps."],["Personne n'a compris les intentions du personnage.","Quelqu’un a compris les intentions du personnage."],["Il demeure quelques incertitudes.","Quelques incertitudes demeurent."],["Ce n'est pas le hasard qui explique cette rencontre.","Le hasard explique cette rencontre."],["Cette décision n'a pas été approuvée par les membres du conseil.","Les membres du conseil ont approuvé cette décision."],["Quelle magnifique interprétation les comédiens nous ont proposée !","Les comédiens nous ont proposé une magnifique interprétation."]],d=[["<b>Le jeune homme</b> a découvert le secret.","C’est le jeune homme qui a découvert le secret.","Le jeune homme, il a découvert le secret."],["Nous avons admiré <b>cette représentation</b>.","C’est cette représentation que nous avons admirée.","Cette représentation, nous l’avons admirée."],["Elle se souvient <b>de son enfance</b>.","C’est de son enfance qu’elle se souvient.","De son enfance, elle s’en souvient."],["Le narrateur observe <b>les passants</b>.","Ce sont les passants que le narrateur observe.","Les passants, le narrateur les observe."],["<b>Cette femme</b> connaît toute la vérité.","C’est cette femme qui connaît toute la vérité.","Cette femme, elle connaît toute la vérité."],["Il tient beaucoup <b>à cette lettre</b>.","C’est à cette lettre qu’il tient beaucoup.","À cette lettre, il y tient beaucoup."],["Nous avons confié notre secret <b>à notre ami</b>.","C’est à notre ami que nous avons confié notre secret.","Notre ami, nous lui avons confié notre secret."],["<b>Les apparences</b> sont parfois trompeuses.","Ce sont les apparences qui sont parfois trompeuses.","Les apparences, elles sont parfois trompeuses."]],e=[["Le public apprécie cette pièce.","Passive et négative","Cette pièce n’est pas appréciée par le public."],["Plusieurs difficultés subsistent.","Impersonnelle et négative","Il ne subsiste aucune difficulté."],["Julie a rédigé cette lettre.","Emphatique et négative","Ce n’est pas Julie qui a rédigé cette lettre."],["Le jury a injustement rejeté cette candidature.","Passive et exclamative","Comme cette candidature a été injustement rejetée par le jury !"],["J'aime beaucoup ce personnage.","Emphatique et exclamative","Ce personnage, comme je l’aime !"],["Des événements étranges se produisent.","Impersonnelle et exclamative","Que d’événements étranges il se produit !"],["Le directeur a signé ce document.","Passive, emphatique et négative","Ce n’est pas par le directeur que ce document a été signé."],["Nous avons oublié cette promesse.","Emphatique et négative","Cette promesse, nous ne l’avons pas oubliée."]];const forms=['Négative','Exclamative','Passive','Impersonnelle','Emphatique'],solved=new Set();function el(tag,t,p){const n=document.createElement(tag);n.textContent=t;p.append(n);return n}function section(i,title,desc){const s=el('section','',document.querySelector('#activities'));s.id='ex'+i;el('h2','Exercice '+i+' – '+title,s);el('p',desc,s);return s}function field(p,id,label){const l=el('label',label,p);l.htmlFor=id;const t=el('textarea','',p);t.id=id;return t}function feedback(p){const f=el('div','',p);f.className='feedback';f.hidden=true;f.setAttribute('aria-live','polite');return f}function score(){document.querySelector('#p').value=solved.size;document.querySelector('#score').textContent=solved.size+' / 15 phrases correctement identifiées'}let s=section(1,'Identifier les formes de phrases','Identifiez la ou les formes particulières de chacune des phrases suivantes : négative, exclamative, passive, impersonnelle ou emphatique. Justifiez votre réponse en relevant les indices grammaticaux. Attention, une même phrase peut cumuler plusieurs formes.');a.forEach(([q,k,why],i)=>{const card=el('article','',s);el('strong',(i+1)+'. '+q,card);const row=el('div','',card),choices=new Set();forms.forEach((t,j)=>{const btn=el('button',t,row);btn.setAttribute('aria-pressed','false');btn.onclick=()=>{choices.has(j)?choices.delete(j):choices.add(j);btn.setAttribute('aria-pressed',String(choices.has(j)));solved.delete(i);score();f.hidden=true}});const input=field(card,'a'+i,'Justification :');const check=el('button','Vérifier',card),f=feedback(card);check.onclick=()=>{f.hidden=false;if(!choices.size||!input.value.trim()){f.className='feedback';f.textContent='Sélectionnez les formes et rédigez une justification.';return}if(choices.size!==k.length||!k.every(x=>choices.has(x))){f.className='feedback bad';f.textContent='Réponse incomplète ou incorrecte. Vérifiez toutes les formes présentes.';return}solved.add(i);score();f.className='feedback good';f.textContent='Formes correctes ! Comparez votre justification : '+why}});function written(s,rows,kind){rows.forEach((r,i)=>{const card=el('article','',s);const q=el('strong','',card);if(kind===4)q.innerHTML=(i+1)+'. '+r[0];else q.textContent=(i+1)+'. '+r[0]+([2,5].includes(kind)?' → '+r[1]:'');const fields=[field(card,'w'+kind+'-'+i,'Votre réponse'+(kind===4?' avec un présentatif':'')+' :')];if(kind===4)fields.push(field(card,'w4b-'+i,'Votre réponse avec un détachement :'));const btn=el('button','Comparer avec la correction',card),f=feedback(card);btn.onclick=()=>{const missing=fields.find(x=>!x.value.trim());if(missing){missing.focus();return}f.hidden=false;f.textContent='';if(kind===4){el('p','Présentatif : '+r[1],f);el('p','Détachement : '+r[2],f)}else el('p','Proposition : '+r[r.length-1],f);el('p','Comparez les indices grammaticaux et les formes demandées. Plusieurs formulations peuvent être correctes.',f)}})}s=section(2,'Transformer les formes de phrases','Transformez les phrases suivantes selon les indications données. Effectuez toutes les modifications grammaticales nécessaires.');written(s,b,2);s=section(3,'Retrouver la phrase de forme neutre, affirmative, active et personnelle','Supprimez les formes particulières des phrases suivantes en effectuant les modifications nécessaires.');written(s,c,3);s=section(4,'Varier les procédés de mise en relief','Réécrivez chaque phrase de deux manières différentes en mettant en relief l’élément en gras : avec le présentatif « c’est… qui » ou « c’est… que », puis avec un détachement accompagné d’une reprise pronominale.');const example=el('article','',s);example.innerHTML='Exemple : J’apprécie <b>ce roman</b>.<p>→ C’est ce roman que j’apprécie.</p><p>→ Ce roman, je l’apprécie.</p>';written(s,d,4);s=section(5,'Cumuler les formes de phrases','À partir de chaque phrase, construisez une nouvelle phrase qui cumule les formes demandées.');written(s,e,5);document.querySelector('#reset').onclick=()=>location.reload();</script></html>
