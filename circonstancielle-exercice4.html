<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les trois groupes de circonstancielles</title><style>*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:12px;font:16px/1.6 system-ui;color:#2b2d42}main{background:#ece8fb;border-radius:20px;padding:20px}h2,h3{color:#285c98}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:white;border-radius:14px;padding:16px;min-width:0}mark{background:#c5dcf8;color:#183c68;border-radius:4px;padding:2px}select,button{font:inherit;border:1px solid #c5d5e7;border-radius:8px;padding:8px;max-width:100%}select{width:100%;background:white;color:#2b2d42}button{cursor:pointer;background:#285c98;color:white;margin:8px 0}small{color:#555}.correction{background:#fff2f8;padding:12px;border-radius:10px} @media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main><h2>Exercice 4 — Distinguer les trois groupes de circonstancielles</h2><p>Classe chaque circonstancielle surlignée dans l’un des trois groupes du cours. Appuie-toi sur les tests de déplacement, de suppression et de remplacement.</p><div class="grid" id="grid"></div><button id="score">Calculer mon score final</button> <button id="reset">Recommencer</button><p id="result" aria-live="polite"></p></main><script>const data=[["Le philosophe observe les étoiles ","pour que la Marquise comprenne son raisonnement",".","","A","Il s’agit d’une subordonnée circonstancielle de but, les 3 manipulations sont donc possibles."],["La nuit était ","que la Marquise distinguait à peine les arbres",".","si sombre","C","Le système si… que lie les deux propositions. Supprimer la subordonnée modifie la construction ou le sens."],["Le philosophe examine la nature ","comme un machiniste examine les ressorts du théâtre",".","","B","Comparaison : la suppression est possible ; le déplacement est peu naturel et le remplacement n’est pas possible."],["","Quand les étoiles apparaissent",", la Marquise interroge le philosophe.","","A","Temps : on peut déplacer la subordonnée en fin de phrase, la supprimer ou la remplacer par « à l’apparition des étoiles »."],["La Marquise découvre l’immensité de l’univers, ","si bien qu’elle s’en effraie",".","","B","Conséquence non corrélative : elle peut être supprimée, mais elle est normalement postposée à la cause. Si bien que forme ici une locution conjonctive."],["Le ciel est ","que la Marquise ne peut compter les étoiles",".","tellement vaste","C","Le système tellement… que exprime une conséquence corrélative. Les deux éléments sont interdépendants."],["","Bien que le ciel soit couvert",", le philosophe poursuit ses explications.","","A","Concession : déplacement, suppression et remplacement possibles (« malgré les nuages »)."],["Le philosophe parle des planètes ","comme un voyageur raconte ses découvertes",".","","B","Comparaison : la postposition est fréquente ; un déplacement peut relever d’un choix stylistique. La suppression est possible."],["Le philosophe donne ","que la Marquise finit par comprendre",".","tant d’exemples","C","Le système tant de… que exprime une conséquence corrélative. La subordonnée ne se manipule pas indépendamment de la construction principale."]];const options={A:'Les véritables circonstancielles',B:'Les circonstancielles peu ou pas déplaçables',C:'Les systèmes interdépendants'};const tests=[[["Oui","Pour que la Marquise comprenne son raisonnement, le philosophe observe les étoiles."],["Oui","Le philosophe observe les étoiles."],["Oui","Le philosophe observe les étoiles en vue d’une meilleure compréhension de son raisonnement par la Marquise."]],[["Non","« Que la Marquise distinguait à peine les arbres, la nuit était si sombre » : construction incorrecte."],["Non","« La nuit était si sombre » laisse en suspens la conséquence ou prend une valeur exclamative."],["Non","Il faut modifier le système si… que pour reformuler la phrase."]],[["Peu naturel","Comme un machiniste examine les ressorts du théâtre, le philosophe examine la nature. Cette antéposition relève d’un choix stylistique."],["Oui","Le philosophe examine la nature."],["Non","Dans le classement du cours, la comparaison ne se remplace pas directement par un CC de même fonction."]],[["Oui","La Marquise interroge le philosophe quand les étoiles apparaissent."],["Oui","La Marquise interroge le philosophe."],["Oui","À l’apparition des étoiles, la Marquise interroge le philosophe."]],[["Non","« Si bien qu’elle s’en effraie, la Marquise découvre l’immensité de l’univers » : la conséquence ne peut normalement précéder sa cause."],["Oui","La Marquise découvre l’immensité de l’univers."],["Non","Un groupe prépositionnel ne restitue pas directement cette conséquence sans reformulation."]],[["Non","« Que la Marquise ne peut compter les étoiles, le ciel est tellement vaste » : construction incorrecte."],["Non","« Le ciel est tellement vaste » laisse en suspens la conséquence ou change la valeur de tellement."],["Non","Le remplacement exige de modifier le système tellement… que."]],[["Oui","Le philosophe poursuit ses explications, bien que le ciel soit couvert."],["Oui","Le philosophe poursuit ses explications."],["Oui","Malgré les nuages, le philosophe poursuit ses explications."]],[["Peu naturel","Comme un voyageur raconte ses découvertes, le philosophe parle des planètes. Cette antéposition est possible mais stylistiquement marquée."],["Oui","Le philosophe parle des planètes."],["Non","Dans le classement du cours, la comparaison ne se remplace pas directement par un CC de même fonction."]],[["Non","« Que la Marquise finit par comprendre, le philosophe donne tant d’exemples » : construction incorrecte."],["Non","« Le philosophe donne tant d’exemples » ne conserve pas la relation de conséquence."],["Non","Il faudrait modifier le système tant de… que pour reformuler la phrase."]]];const states=[];data.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h3>Phrase '+(i+1)+'</h3><p class="sentence"></p><small>Phrase construite autour des thèmes de Fontenelle</small><p><label for="q'+i+'">Groupe de la circonstancielle</label><select id="q'+i+'"><option value="">Choisis une réponse</option></select></p><button>Valider ma réponse</button><div class="feedback" aria-live="polite"></div><div class="correction" hidden></div>';const p=a.querySelector('.sentence');p.append(document.createTextNode(d[0]));if(d[3]){const m=document.createElement('mark');const match=d[3].match(/^(si|tellement|tant d’)(.*)$/);m.textContent=match[1];p.append(m,document.createTextNode(match[2]+' '))}const m=document.createElement('mark');m.textContent=d[1];p.append(m,document.createTextNode(d[2]));const s=a.querySelector('select'),f=a.querySelector('.feedback'),c=a.querySelector('.correction');Object.entries(options).forEach(([k,v])=>s.add(new Option(k+'. '+v,k)));function check(){if(!s.value){f.textContent='Choisis une réponse.';c.hidden=true;return false}const ok=s.value===d[4];f.textContent=ok?'✓ Bonne réponse !':'✗ Réponse incorrecte';f.style.color=ok?'#24734c':'#a43d39';c.replaceChildren();const h=document.createElement('strong');h.textContent='Correction : '+options[d[4]];c.append(h);tests[i].forEach(([status,example],j)=>{const box=document.createElement('div');box.style.cssText='background:white;border-radius:8px;padding:10px;margin:10px 0';const title=document.createElement('strong');title.style.color=status==='Oui'?'#24734c':status==='Non'?'#a43d39':'#805b19';title.textContent=(j+1)+'. '+['Déplacement','Suppression','Remplacement'][j]+' : '+status;const p=document.createElement('p');p.style.margin='6px 0 0';p.textContent=example;box.append(title,p);c.append(box)});const conclusion=document.createElement('p');conclusion.textContent='Bilan : '+d[5];c.append(conclusion);c.hidden=false;return ok}function reset(){s.value='';f.textContent='';c.hidden=true}s.onchange=()=>{f.textContent='';c.hidden=true};a.querySelector('button').onclick=check;states.push({check,reset});document.querySelector('#grid').append(a)});document.querySelector('#score').onclick=()=>document.querySelector('#result').textContent='Score : '+states.filter(s=>s.check()).length+' / '+states.length;document.querySelector('#reset').onclick=()=>{states.forEach(s=>s.reset());document.querySelector('#result').textContent=''}</script></body></html>
