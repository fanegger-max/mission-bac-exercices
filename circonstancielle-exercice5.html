<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identifier le mode employé</title><style>*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:12px;font:16px/1.6 system-ui;color:#2b2d42}main{background:#e0f1ea;border-radius:20px;padding:20px}h2,h3{color:#285c98}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:white;border-radius:14px;padding:16px;min-width:0}mark{background:#c5dcf8;color:#183c68;border-radius:4px;padding:2px}button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:#285c98;color:white;cursor:pointer;margin:8px 0}label{display:inline-block;margin:8px 16px 8px 0}small{color:#555}.correction{background:#fff2f8;padding:12px;border-radius:10px} [hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main><h2>Exercice 5 — Identifier le mode employé</h2><p>Identifie le mode du verbe de chaque proposition subordonnée circonstancielle surlignée : indicatif ou subjonctif.</p><div class="grid" id="grid"></div><button id="score">Calculer mon score final</button> <button id="reset">Recommencer</button><p id="result" aria-live="polite"></p></main><script>const data=[["Il faudrait que les gens de la lune eussent bien de l’esprit, ","s’ils devinaient tout cela",".","devinaient","Indicatif","imparfait","La subordonnée circonstancielle de condition décrit la situation dans laquelle le fait principal pourrait se produire. C’est pourquoi le verbe est à l’indicatif.","Fontenelle, Second Soir"],["Le philosophe multiplie les exemples ","pour que la Marquise comprenne son raisonnement",".","comprenne","Subjonctif","présent","Le but ouvre une perspective : une intention.","Phrase construite"],["","Quand les étoiles apparaîtront",", nous observerons le ciel.","apparaîtront","Indicatif","futur simple","La subordonnée situe le fait principal dans une situation future.","Phrase construite"],["","Bien que le ciel soit couvert",", le philosophe poursuit ses explications.","soit","Subjonctif","présent","La concession présente une situation contraire à ce qui est normalement attendu.","Phrase construite"],["La Marquise veut poursuivre la conversation ","avant que la nuit finisse",".","finisse","Subjonctif","présent","Avant que ouvre une perspective d’anticipation chronologique.","Phrase construite"],["Phaéton monte, ","parce qu’il est tiré par des cordes",", et qu’un poids plus pesant que lui descend.","est tiré","Indicatif","présent (voix passive)","La cause décrit la situation dans laquelle se produit le fait principal.","Fontenelle, Premier Soir"],["Le philosophe attend ","jusqu’à ce que les nuages aient disparu",".","aient disparu","Subjonctif","passé","La subordonnée ouvre une perspective d’anticipation chronologique.","Phrase construite"],["Voilà l’univers si grand ","que je m’y perds",", je ne sais plus où je suis, je ne suis plus rien.","perds","Indicatif","présent","La conséquence est présentée comme effective.","Fontenelle, Cinquième Soir"],["La Marquise emporte une carte du ciel ","afin qu’elle puisse reconnaître les constellations",".","puisse","Subjonctif","présent","La subordonnée exprime une intention, une perspective.","Phrase construite"],["La Marquise reprit ses questions ","après que le philosophe eut terminé son explication",".","eut terminé","Indicatif","passé antérieur","Après que situe le fait principal par rapport à un fait antérieur accompli.","Phrase construite"]];const states=[];data.forEach((d,i)=>{const a=document.createElement('article');a.innerHTML='<h3>Phrase '+(i+1)+'</h3><p class="sentence"></p><small></small><p><strong>Quel est le mode du verbe de la circonstancielle ?</strong></p><label><input type="radio" name="q'+i+'" value="Indicatif"> Indicatif</label><label><input type="radio" name="q'+i+'" value="Subjonctif"> Subjonctif</label><div><button>Valider ma réponse</button></div><p class="feedback" aria-live="polite"></p><div class="correction" hidden></div>';const p=a.querySelector('.sentence'),m=document.createElement('mark');m.textContent=d[1];if(i===7){const k=d[0].lastIndexOf('si');const cm=document.createElement('mark');cm.textContent='si';p.append(document.createTextNode(d[0].slice(0,k)),cm,document.createTextNode(d[0].slice(k+2)))}else p.append(document.createTextNode(d[0]));p.append(m,document.createTextNode(d[2]));a.querySelector('small').textContent=d[7];const f=a.querySelector('.feedback'),c=a.querySelector('.correction');function check(){const v=a.querySelector('input:checked')?.value;if(!v){f.textContent='Choisis une réponse.';f.style.color='';c.hidden=true;return false}const ok=v===d[4];f.textContent=ok?'✓ Bonne réponse !':'✗ Réponse incorrecte';f.style.color=ok?'#24734c':'#a43d39';c.replaceChildren();[['Verbe',d[3]],['Mode',d[4]],['Temps',d[5]],['Justification',d[6]]].forEach(([k,v])=>{const p=document.createElement('p');p.style.margin='6px 0';const b=document.createElement('strong');b.textContent=k+' : ';p.append(b,document.createTextNode(v));c.append(p)});c.hidden=false;return ok}function reset(){a.querySelectorAll('input').forEach(b=>b.checked=false);f.textContent='';c.hidden=true}a.querySelectorAll('input').forEach(b=>b.onchange=()=>{f.textContent='';c.hidden=true});a.querySelector('button').onclick=check;states.push({check,reset});document.querySelector('#grid').append(a)});document.querySelector('#score').onclick=()=>document.querySelector('#result').textContent='Score : '+states.filter(s=>s.check()).length+' / '+states.length;document.querySelector('#reset').onclick=()=>{states.forEach(s=>s.reset());document.querySelector('#result').textContent=''}</script></body></html>
