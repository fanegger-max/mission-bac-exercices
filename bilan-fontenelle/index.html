<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Me tester — Entretiens sur la pluralité des mondes</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#fafafa;color:#2b2d42;margin:0}main{max-width:1100px;margin:auto;padding:20px}header,article{background:white;border:1px solid #e3eefb;border-radius:16px;padding:18px}header{background:#e3eefb;margin-bottom:20px}h1,h2{color:#285c98}h1{font-size:1.7rem}#questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}button{font:inherit;cursor:pointer;border:1px solid #ccc;border-radius:9px;padding:10px;background:white;color:#2b2d42}article button{display:block;width:100%;text-align:left;margin:6px 0}button:disabled{cursor:default;opacity:1}.good{background:#dff3e5;border-color:#36844e}.bad{background:#fce0e0;border-color:#b84343}.feedback{font-size:.92rem}#score{font-weight:bold;color:#285c98}a{color:#285c98}@media(max-width:680px){#questions{grid-template-columns:1fr}}

</style><main><header><img src="https://missionbacfrancais.wordpress.com/wp-content/uploads/2026/11/mascotte-methodes-ecrit.png" width="76" alt="" style="float:right"><h1>Me tester — Entretiens sur la pluralité des mondes</h1><p>20 questions pour vérifier tes connaissances. Choisis une seule réponse par question.</p><p id="score" aria-live="polite"></p><button id="reset">Recommencer</button></header><div id="questions"></div><p><a href="https://missionbacfrancais.fr/entretiens-sur-la-pluralite-des-mondes-cours-et-explications/">Revenir au cours</a></p></main><script>const data=[{"q":"Quand paraît la première édition ?","opts":["1657","1686","1687","1757"],"k":1,"e":"La première édition paraît en 1686."},{"q":"Combien de soirs comporte la première édition ?","opts":["5","6","4","7"],"k":0,"e":"Le sixième soir est ajouté en 1687."},{"q":"Quel est le parcours associé ?","opts":["Émancipations créatrices","La comédie sociale","Anatomie des passions","Le goût de la science"],"k":3,"e":"Le parcours interroge le plaisir de connaître."},{"q":"Quelle forme littéraire adopte Fontenelle ?","opts":["Le traité en vers","Le roman épistolaire","Le dialogue","Le récit autobiographique"],"k":2,"e":"Le philosophe converse avec la Marquise."},{"q":"Quel système est présenté au Premier Soir ?","opts":["Géocentrique","Héliocentrique","Un univers sans mouvement","Un univers sans planètes"],"k":1,"e":"La Terre n’est plus au centre de l’univers."},{"q":"Quel astre est au cœur du Second Soir ?","opts":["La Lune","Mars","Jupiter","Le Soleil"],"k":0,"e":"Le dialogue envisage une Lune habitée."},{"q":"Que découvre-t-on au Troisième Soir ?","opts":["La fixité de la Terre","La fin des étoiles","L’absence de diversité du vivant","La possibilité d’autres planètes habitées"],"k":3,"e":"Le monde potentiellement habité s’élargit."},{"q":"Quelle théorie est expliquée au Quatrième Soir ?","opts":["La génération spontanée","La relativité","Les tourbillons de Descartes","La gravitation newtonienne"],"k":2,"e":"Le cours présente les tourbillons cartésiens."},{"q":"Que deviennent les étoiles fixes au Cinquième Soir ?","opts":["Des satellites de la Terre","Des centres possibles de systèmes planétaires","Des comètes","Des planètes du Soleil"],"k":1,"e":"L’univers s’élargit à une multitude de systèmes."},{"q":"Quelle institution Fontenelle sert-il comme secrétaire perpétuel ?","opts":["L’Académie des sciences","L’Observatoire de Paris","L’Académie royale de musique","La Comédie-Française"],"k":0,"e":"Cette fonction lui donne accès aux avancées scientifiques."},{"q":"Quel double objectif annonce la préface ?","opts":["Émouvoir et effrayer","Convaincre et condamner","Décrire et raconter","Instruire et divertir"],"k":3,"e":"Fontenelle veut instruire et divertir tout ensemble."},{"q":"À quoi la nature est-elle comparée au Premier Soir ?","opts":["À un tableau immobile","À une bibliothèque","À un spectacle d’opéra","À un jardin fermé"],"k":2,"e":"Les machines cachées illustrent les mécanismes naturels."},{"q":"Qu’est-ce qu’un syllogisme ?","opts":["Une comparaison entre deux objets","Deux prémisses conduisant à une conclusion","Une succession de questions sans réponse","Une affirmation sans justification"],"k":1,"e":"C’est un raisonnement en trois propositions."},{"q":"À quoi servent les expériences de pensée ?","opts":["À imaginer des phénomènes non directement observables","À remplacer tout raisonnement","À prouver chaque hypothèse définitivement","À mémoriser uniquement des dates"],"k":0,"e":"L’imagination aide à dépasser les limites des sens."},{"q":"Que signifie le « pourquoi non ? » dans la démarche scientifique ?","opts":["Refuser toute discussion","Affirmer une certitude absolue","Abandonner toute recherche","Envisager et examiner des hypothèses"],"k":3,"e":"La science progresse par conjectures et révisions."},{"q":"Quel avantage pédagogique présentent les questions de la Marquise ?","opts":["Elles empêchent toute progression","Elles remplacent les connaissances","Elles relancent et orientent les explications","Elles imposent un exposé sans digression"],"k":2,"e":"Le dialogue s’adapte à la compréhension de l’élève."},{"q":"Quelle œuvre de Racine est citée au Cinquième Soir ?","opts":["Andromaque","Phèdre","Britannicus","Bérénice"],"k":1,"e":"Le philosophe reprend la réponse de Phèdre à Oenone."},{"q":"Comment réagit la Marquise à l’immensité de l’univers ?","opts":["Elle éprouve de l’effroi","Elle reste indifférente","Elle refuse de regarder le ciel","Elle éprouve uniquement de la joie"],"k":0,"e":"Le décentrement trouble ses repères."},{"q":"Quel sentiment éprouve le philosophe face à cet univers immense ?","opts":["Un sentiment d’oppression","Une peur de la connaissance","Un ennui profond","Un sentiment de liberté"],"k":3,"e":"L’immensité lui procure liberté et plaisir esthétique."},{"q":"Quelle limite le cours souligne-t-il à la diffusion du savoir ?","opts":["Fontenelle interdit aux femmes de raisonner","Le dialogue exclut toute pédagogie","Le savoir reste parfois réservé à une troupe choisie","Le philosophe refuse les découvertes"],"k":2,"e":"Le Sixième Soir nuance l’idéal d’un savoir accessible à tous."}];let score=0,done=0;const root=document.querySelector('#questions');function refresh(){document.querySelector('#score').textContent='Score : '+score+'/20 — '+done+'/20 réponses'+(done===20?' — Bilan terminé !':'')}function init(){score=done=0;root.replaceChildren();data.forEach((v,i)=>{const a=document.createElement('article');const h=document.createElement('h2');h.style.fontSize='1rem';h.textContent=(i+1)+'. '+v.q;a.append(h);const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');const bs=v.opts.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{done++;if(j===v.k)score++;bs.forEach((z,k)=>{z.disabled=true;if(k===v.k)z.classList.add('good');else if(k===j)z.classList.add('bad')});f.textContent=(j===v.k?'Bonne réponse ! ':'À revoir. ')+v.e;refresh()};a.append(b);return b});a.append(f);root.append(a)});refresh()}document.querySelector('#reset').onclick=init;init();</script></html>
